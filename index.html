<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polaris">
<meta name="theme-color" content="#f4f1ea">
<title>Polaris</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@300;400;500&display=swap');
  /* 源柔ゴシック L（Web用最適化版、shogo82148/genjyuugothic-subsets経由） */
  @import url('https://cdn.jsdelivr.net/gh/shogo82148/genjyuugothic-subsets@main/fonts/GenJyuuGothicL-Regular.css');
  :root{
    --ink:#1a1d24; --ink-soft:#4a4f5c; --ink-faint:#9498a6;
    --paper:#f4f1ea; --paper-warm:#eceadf; --line:#e0dbcf;
    --card:#fbf9f4; --star:#c9a227; --star-soft:#e3d4a0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'M PLUS 1',-apple-system,sans-serif;background:#c8c5bd;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .phone{width:390px;height:844px;max-height:92vh;background:var(--paper);border-radius:52px;border:13px solid #14161c;box-shadow:0 30px 70px rgba(0,0,0,0.38),inset 0 0 0 2px #2a2d35;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:30px;background:#14161c;border-radius:0 0 20px 20px;z-index:100;}
  /* 実機スマホ幅では枠を消して全画面、ノッチや偽ステータスバーも非表示 */
  @media (max-width: 600px){
    body{padding:0;background:var(--paper);align-items:stretch;}
    .phone{width:100%;height:100vh;max-height:none;border-radius:0;border:none;box-shadow:none;}
    .notch{display:none;}
    .statusbar{display:none;}
    .titlebar{padding-top:max(12px, env(safe-area-inset-top));}
    .tabbar{padding-bottom:max(20px, env(safe-area-inset-bottom));}
  }
  .statusbar{height:50px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:14px;font-weight:700;color:var(--ink);z-index:50;}
  .statusbar .right{display:flex;gap:6px;align-items:center;font-size:13px;}
  .titlebar{padding:6px 22px 10px;flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-end;}
  .titlebar .tleft .small{font-size:13px;letter-spacing:0.3em;color:var(--star);font-weight:700;}
  .titlebar h1{font-size:28px;font-weight:800;letter-spacing:0.02em;color:var(--ink);margin-top:2px;}
  .titlebar .sub{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .archive-btn{background:none;border:none;font-family:inherit;font-size:11px;color:var(--ink-faint);letter-spacing:0.06em;padding:6px 4px;flex-shrink:0;cursor:pointer;}
  .archive-btn:active{color:var(--star);}
  .archive-btn:hover{color:var(--star);}
  .title-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}

  /* 仮タスク入力 */
  .inbox-input-row{display:flex;gap:6px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px 4px 4px 14px;transition:border-color 0.2s;}
  .inbox-input-row:focus-within{border-color:var(--star);}
  #inboxInput{flex:1;background:none;border:none;padding:9px 0;font-size:13.5px;color:var(--ink);font-family:inherit;outline:none;min-width:0;}
  #inboxInput::placeholder{color:var(--ink-faint);}
  .inbox-more{background:none;border:none;color:var(--ink-faint);font-family:inherit;font-size:18px;width:32px;cursor:pointer;border-radius:7px;letter-spacing:0;}
  .inbox-more:hover{color:var(--star);background:rgba(201,162,39,0.08);}
  .inbox-hint{font-size:10.5px;color:var(--ink-faint);margin-top:6px;letter-spacing:0.02em;text-align:right;padding-right:4px;}
  .screen{flex:1;overflow-y:auto;padding:4px 22px 24px;-webkit-overflow-scrolling:touch;}
  .screen::-webkit-scrollbar{display:none;}
  .view{display:none;animation:fade 0.35s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .lead{font-size:13px;color:var(--ink-soft);line-height:1.85;margin-bottom:18px;}

  .chip-zone{margin-bottom:24px;}
  .chip-label{font-size:11px;color:var(--ink-faint);letter-spacing:0.14em;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:16px;padding:7px 13px;transition:all 0.2s;}
  .chip:active{background:var(--paper-warm);border-color:var(--star);color:var(--ink);}
  .chip::before{content:'+ ';color:var(--star);font-weight:700;}

  .lcards{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;position:relative;transition:transform 0.22s,border-color 0.22s;}
  .lcard:active{transform:scale(0.99);border-color:var(--star);}
  .lcard .word{font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:0.02em;}
  .lcard .def{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;}
  .lcard .def.empty{color:var(--ink-faint);}
  .lcard .badge{position:absolute;top:16px;right:17px;font-size:11px;color:var(--star);}

  .star-GOAL{font-size:10px;letter-spacing:0.28em;color:var(--star);text-transform:uppercase;margin-bottom:5px;font-weight:700;}
  .star-dir{font-size:17px;font-weight:700;color:var(--ink);line-height:1.45;padding-right:20px;}
  .star-meta{font-size:11px;color:var(--ink-faint);margin-top:10px;}
  .star-open-hint{font-size:11px;color:var(--star);margin-top:12px;letter-spacing:0.04em;}
  .star-open-hint::after{content:' ›';}
  /* step preview on star card */
  .star-preview{margin-top:13px;padding-top:0;border-top:none;display:flex;flex-direction:column;gap:7px;}
  .pvrow{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
  .pvrow .pvdot{color:var(--star);font-size:8px;flex-shrink:0;}
  .pvrow .pvdue{font-size:10px;color:var(--ink-faint);margin-left:auto;flex-shrink:0;letter-spacing:0.03em;}
  .pvrow .pvdue.past{color:#a98b6a;}
  .pvmore{font-size:11px;color:var(--ink-faint);margin-top:2px;}

  /* achievement collection shelf */
  .trophy-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  .trophy{background:linear-gradient(160deg,#fdf9ec,#f3ead0);border:1px solid #e6d9b3;border-radius:16px;padding:18px 14px 16px;text-align:center;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(201,162,39,0.1);transition:transform 0.2s;}
  .trophy:active{transform:scale(0.97);}
  .trophy::before{content:'';position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:90px;height:90px;background:radial-gradient(circle,rgba(201,162,39,0.22),transparent 70%);}
  .trophy .star{font-size:26px;color:var(--star);filter:drop-shadow(0 0 6px rgba(201,162,39,0.5));}
  .trophy .tdir{font-size:13px;font-weight:700;color:var(--ink);margin-top:8px;line-height:1.4;}
  .trophy .tmeta{font-size:10px;color:var(--ink-faint);margin-top:7px;letter-spacing:0.03em;}
  .trophy .tribbon{font-size:9px;letter-spacing:0.2em;color:var(--star);text-transform:uppercase;font-weight:700;margin-top:4px;}

  .vcustom-btn{font-family:inherit;width:100%;background:none;border:1px dashed var(--line);border-radius:14px;padding:15px;color:var(--ink-faint);font-size:13px;transition:border-color 0.2s;}
  .vcustom-btn:active{border-color:var(--star);}
  .vcustom-btn .p{color:var(--star);font-weight:700;}

  .field-label{font-size:11px;color:var(--ink-faint);letter-spacing:0.16em;text-transform:uppercase;margin:16px 0 8px;}
  input[type=text],textarea,select,input[type=date]{font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;font-size:16px;color:var(--ink);width:100%;transition:border-color 0.25s;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--star);}
  ::placeholder{color:var(--ink-faint);}
  textarea{resize:none;min-height:90px;line-height:1.7;}
  .btn-full{font-family:inherit;width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;letter-spacing:0.08em;margin-top:14px;transition:transform 0.2s;}
  .btn-full:active{transform:scale(0.97);}
  .btn-ghost{font-family:inherit;width:100%;background:none;color:var(--ink-faint);border:none;padding:12px;font-size:13px;margin-top:6px;}
  .btn-ghost.danger:active{color:#b4503e;}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:12px;line-height:1.7;}

  .sheet-bg{position:absolute;inset:0;background:rgba(20,22,28,0.4);z-index:200;display:none;}
  /* 全画面シート（仮置き・価値観編集）より上に出る編集系モーダル */
  #cbg, #sbg, #mvbg, #ebg, #gpbg, #dfbg, #ssbg, #dbg{z-index:399;}
  #csheet, #ssheet, #mvsheet, #esheet, #gpsheet, #dfsheet, #sssheet, #dsheet{z-index:400 !important;}
  /* タスク詳細はテーマ詳細より上 */
  #tdbg{z-index:420;}
  #tdsheet{z-index:421 !important;}
  /* 編集系シート（タスク編集など）はタスク詳細より上 */
  #sbg{z-index:430;}
  #ssheet{z-index:431 !important;}
  /* 指標(グラフ)編集はテーマ編集の上に出る必要がある */
  #mbg{z-index:450;}
  #msheet{z-index:451 !important;}
  .sheet-bg.open{display:block;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;padding:20px 22px 30px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(.2,.8,.2,1);z-index:201;max-height:90%;overflow-y:auto;visibility:hidden;}
  .sheet.open{transform:translateY(0);visibility:visible;}
  .sheet::-webkit-scrollbar{display:none;}
  .sheet .grip{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px;}
  .sheet .sword{font-size:11px;letter-spacing:0.2em;color:var(--star);text-transform:uppercase;}
  .sheet h2{font-size:20px;font-weight:800;color:var(--ink);margin:3px 0 14px;line-height:1.4;}
  .sheet label{font-size:11px;color:var(--ink-faint);letter-spacing:0.12em;text-transform:uppercase;}
  .due-row{display:flex;gap:10px;align-items:center;margin-top:10px;}
  .due-row input[type=date]{flex:1;}
  .due-clear{font-family:inherit;background:none;border:none;color:var(--ink-faint);font-size:12px;}
  .due-note{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.6;}
  .time-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .time-row input[type=time]{flex:0 0 auto;width:auto;padding:11px 12px;font-size:14px;}
  .time-sep{color:var(--ink-faint);font-size:13px;}
  .time-or{color:var(--ink-faint);font-size:12px;margin:0 2px;}
  .dur-in{width:84px !important;padding:11px 12px !important;font-size:14px !important;}
  .rep-row{display:flex;gap:7px;margin-top:8px;}
  .rep-opt{flex:1;font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:11px;padding:10px 4px;transition:all 0.2s;}
  .rep-opt.active{border-color:var(--star);background:rgba(201,162,39,0.08);color:var(--ink);font-weight:700;}
  .weekday-row{display:flex;gap:5px;margin-top:9px;}
  .wd{flex:1;font-family:inherit;font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:9px;padding:8px 0;}
  .wd.active{border-color:var(--star);background:rgba(201,162,39,0.1);color:var(--ink);font-weight:700;}
  .monthday-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;}
  .md{font-family:inherit;font-size:11.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 0;text-align:center;}
  .md.active{border-color:var(--star);background:rgba(201,162,39,0.1);color:var(--ink);font-weight:700;}
  .dur-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .dur-label{font-size:11.5px;color:var(--ink-faint);letter-spacing:0.05em;}
  .dur-label #eDurCalc{color:var(--ink-soft);font-weight:700;}
  .dur-presets{display:flex;gap:5px;margin-left:auto;}
  .dur-p{font-family:inherit;font-size:11.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;}
  .dur-p:active{border-color:var(--star);background:rgba(201,162,39,0.1);color:var(--ink);}
  .time-row input[type=text]{flex:0 0 auto;width:80px;padding:11px 12px;font-size:14px;text-align:center;}
  .time-row input[type=time]{flex:0 0 auto;width:auto;padding:11px 12px;font-size:14px;}
  /* step meta on tree */
  .stext .smeta{display:block;font-size:10.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:0.03em;}
  .stext .smemo{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.5;opacity:0.85;}
  .stext .srep{display:inline-block;font-size:9.5px;color:var(--star);border:1px solid var(--star-soft);border-radius:8px;padding:1px 6px;margin-top:4px;letter-spacing:0.05em;}
  /* trail memo + repeat style */
  .step .what .tmemo{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.55;font-weight:400;white-space:pre-wrap;word-wrap:break-word;}
  .step.repeat::before{width:6px;height:6px;left:-20px;background:var(--star-soft);border-color:var(--star-soft);box-shadow:none;}
  .step.repeat .what{font-weight:400;color:var(--ink-soft);}
  .step.repeat .repdot{font-size:9px;color:var(--star);border:1px solid var(--star-soft);border-radius:7px;padding:0 5px;margin-left:6px;letter-spacing:0.04em;}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .cal-mo{font-size:17px;font-weight:800;color:var(--ink);}
  .cal-nav{background:none;border:1px solid var(--line);border-radius:9px;font-family:inherit;color:var(--ink-soft);font-size:14px;width:32px;height:32px;}
  .cal-nav:active{border-color:var(--star);color:var(--star);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{text-align:center;font-size:10px;color:var(--ink-faint);padding:4px 0;}
  .cal-cell{aspect-ratio:0.85;border-radius:9px;border:1px solid transparent;padding:4px;display:flex;flex-direction:column;font-size:11px;color:var(--ink-soft);position:relative;overflow:hidden;min-width:0;}
  .cal-cell.has{background:var(--card);border-color:var(--line);}
  .cal-cell.today{border-color:var(--star);}
  .cal-cell .dn{font-size:10px;color:var(--ink-faint);}
  .cal-cell.today .dn{color:var(--star);font-weight:700;}
  .cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--star);}
  /* 月セル内のタイトル表示 */
  .mt-items{display:flex;flex-direction:column;gap:2px;margin-top:3px;min-width:0;}
  .mt-bar{font-size:9.5px;line-height:1.25;padding:2px 4px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;}
  .mt-bar.mt-event{background:#6a8cb0;}
  .mt-bar.mt-task{background:#7a9b7a;}
  .mt-bar.mt-task.done{opacity:0.4;text-decoration:line-through;}
  .mt-bar.mt-step{background:linear-gradient(150deg,var(--star),#b89020);color:#fff;}
  .mt-more{font-size:9px;color:var(--ink-faint);padding-left:3px;letter-spacing:0;}
  .cal-cell{overflow:hidden;}
  .cal-list{margin-top:18px;}
  .cal-day-group{margin-bottom:16px;}
  .cal-day-label{font-size:12px;font-weight:700;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .cal-item{display:flex;gap:9px;align-items:baseline;padding:7px 0;}
  .cal-item .cdot{width:7px;height:7px;border-radius:50%;background:var(--star);flex-shrink:0;margin-top:5px;}
  .cal-item .ci-body{flex:1;}
  .cal-item .ci-task{font-size:13.5px;color:var(--ink);}
  .cal-item .ci-meta{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
  .cal-item .ci-dir{font-size:10px;color:var(--star);margin-top:1px;}
  .cal-item .ci-memo{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.55;}
  /* segment */
  .cal-seg{display:flex;gap:0;background:var(--paper-warm);border-radius:11px;padding:3px;margin-bottom:14px;}
  .cal-seg .seg{flex:1;font-family:inherit;font-size:13px;color:var(--ink-soft);background:none;border:none;border-radius:9px;padding:9px 0;transition:all 0.2s;}
  .cal-seg .seg.active{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
  /* vertical (week/day) */
  .vcal{position:relative;border-top:1px solid var(--line);margin-top:4px;}
  .vcal-dayhead{display:flex;padding-left:38px;position:sticky;top:0;background:var(--paper);z-index:5;}
  .vcal-dayhead .vdh{flex:1;text-align:center;font-size:10.5px;color:var(--ink-faint);padding:6px 0;}
  .vcal-dayhead .vdh.today{color:var(--star);font-weight:700;}
  .vcal-body{position:relative;}
  .vcal-hour{display:flex;height:34px;border-bottom:1px solid #efe9da;}
  .vcal-hour .vh-label{width:38px;flex-shrink:0;font-size:9.5px;color:var(--ink-faint);text-align:right;padding-right:6px;transform:translateY(-6px);}
  .vcal-hour .vh-cols{flex:1;display:flex;}
  .vcal-hour .vh-col{flex:1;border-left:1px solid #efe9da;}
  .vcal-events{position:absolute;top:0;left:38px;right:0;bottom:0;pointer-events:none;z-index:10;}
  .vcal-cols{position:absolute;top:0;left:38px;right:0;bottom:0;z-index:1;}
  .vcol{position:absolute;top:0;bottom:0;cursor:pointer;}
  .vcol-sel{position:absolute;background:rgba(201,162,39,0.25);border:1px dashed var(--star);border-radius:4px;pointer-events:none;z-index:5;}
  .vev{position:absolute;background:linear-gradient(150deg,rgba(201,162,39,0.92),rgba(201,162,39,0.78));color:#fff;border-radius:7px;padding:4px 7px;font-size:10.5px;line-height:1.3;overflow:hidden;box-shadow:0 1px 4px rgba(201,162,39,0.3);pointer-events:auto;z-index:11;}
  .vev *{color:#fff !important;}
  .vev.allday{background:linear-gradient(150deg,#b9a06a,#a89058);}
  .vev .vev-t{font-weight:600;display:block;white-space:normal;overflow:hidden;word-wrap:break-word;line-height:1.25;}
  .vev .vev-m{font-size:9px;opacity:0.9;}
  .vcal-allday{display:flex;padding-left:38px;border-bottom:1px solid var(--line);min-height:26px;}
  .vcal-allday .vad-col{flex:1;padding:2px;display:flex;flex-direction:column;gap:2px;}
  .vad-chip{background:#b9a06a;color:#fff;border-radius:5px;font-size:9px;padding:2px 4px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vcal-scroll{max-height:440px;overflow-y:auto;}
  .vcal-scroll::-webkit-scrollbar{display:none;}
  .day-title{font-size:14px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:8px;}
  .ulink{color:var(--star);text-decoration:underline;text-decoration-color:rgba(201,162,39,0.4);word-break:break-all;}
  .ulink:active{opacity:0.7;}
  .metric-input-row{display:flex;align-items:baseline;gap:8px;margin-top:6px;}
  .metric-input-row input{flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;}
  .metric-unit-label{font-size:14px;color:var(--ink-soft);}
  /* metrics on star detail */
  .metrics-on-star{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .mcard{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
  .mcard .mg{font-size:18px;color:var(--star);flex-shrink:0;}
  .mcard.flat .mg{color:#5a7a9c;}
  .mcard .mname{flex:1;font-size:14px;font-weight:700;color:var(--ink);}
  .mcard .mcur{font-size:14px;color:var(--ink-soft);font-weight:700;}
  .mcard .mcur .u{font-size:11px;color:var(--ink-faint);margin-left:2px;}
  .mcard .mrec{font-family:inherit;background:var(--star);color:#fff;border:none;border-radius:9px;padding:6px 11px;font-size:11.5px;font-weight:700;}
  .mcard .mrec:active{transform:scale(0.96);}
  .mcard .medit{background:none;border:none;color:var(--ink-faint);font-size:14px;}
  /* metric kind list */
  .metric-kind-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .mkind-opt{display:flex;gap:12px;align-items:center;font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;text-align:left;}
  .mkind-opt:active{border-color:var(--star);}
  .mkind-opt.active{border-color:var(--star);background:rgba(201,162,39,0.06);}
  .mkind-opt .mk-glyph{font-size:22px;color:var(--star);flex-shrink:0;width:30px;text-align:center;}
  .mkind-opt[data-mk="flat"] .mk-glyph{color:#5a7a9c;}
  .mkind-opt .mk-title{font-size:14px;font-weight:700;color:var(--ink);}
  .mkind-opt .mk-desc{font-size:11px;color:var(--ink-faint);margin-top:2px;line-height:1.5;}
  .metric-tag{display:inline-block;font-size:9.5px;letter-spacing:0.06em;border:1px solid var(--line);border-radius:7px;padding:1px 6px;margin-top:4px;color:var(--ink-soft);}
  .metric-tag.up{color:#9c8330;border-color:var(--star-soft);}
  .metric-tag.down{color:#9c8330;border-color:var(--star-soft);}
  .metric-tag.sum{color:#9c8330;border-color:var(--star-soft);}
  .metric-tag.flat{color:#5a7a9c;border-color:#bcc8d4;}
  /* metric graph */
  .mblock{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px 10px;}
  .mblock .mhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .mblock .mtitle{font-size:13px;font-weight:700;color:var(--ink);}
  .mblock .msub{font-size:10.5px;color:var(--ink-faint);}
  .mblock .mlatest{font-size:18px;font-weight:800;color:var(--star);}
  .mblock.flat .mlatest{color:var(--accent,#5a7a9c);}
  .mblock .munit{font-size:11px;color:var(--ink-faint);margin-left:3px;}
  .mblock svg{width:100%;height:100px;display:block;margin-top:4px;}
  .mblock .mfoot{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:4px;padding:0 2px;}
  /* event styles — 手順(金)と区別する青系 */
  .vev.event{background:linear-gradient(150deg,#6a8cb0,#5a7a9c);box-shadow:0 1px 4px rgba(90,122,156,0.3);}
  .vev.event.allday{background:linear-gradient(150deg,#7a90ab,#6b819c);}
  .cal-dot.event{background:#6a8cb0;}
  .vad-chip.event{background:#6a8cb0;}

  /* カテゴリグループ */
  .step-group{
    margin-top:24px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .step-group-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;
    padding-bottom:6px;
  }
  .step-group-name{
    font-size:13px;
    font-weight:700;
    color:var(--star);
    letter-spacing:0.06em;
  }
  .step-group-edit{
    background:none;border:none;
    font-family:inherit;font-size:11px;
    color:var(--ink-faint);
    padding:4px 8px;
    cursor:pointer;
  }
  .step-group-edit:hover{color:var(--star);}
  .step-group .sadd-sub-in-group{
    display:block;width:100%;
    font-family:inherit;font-size:12px;
    color:var(--ink-faint);
    background:none;border:none;
    padding:8px 0;
    margin-top:6px;
    text-align:left;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .step-group .sadd-sub-in-group:hover{color:var(--star);}
  /* 移動先オプション */
  .mv-opt{display:block;width:100%;text-align:left;font-family:inherit;background:none;border:1px solid var(--line);border-radius:11px;padding:13px 16px;cursor:pointer;color:var(--ink);font-size:14px;letter-spacing:0.02em;}
  .mv-back{position:absolute;top:18px;left:18px;background:none;border:none;font-family:inherit;font-size:11px;color:var(--ink-faint);font-weight:300;letter-spacing:0.05em;cursor:pointer;padding:6px 8px;border-radius:4px;z-index:2;}
  .mv-back:hover{color:var(--star);}
  .mv-opt:hover{border-color:var(--star);background:rgba(201,162,39,0.08);}
  .mv-opt.current{opacity:0.4;cursor:default;}
  .mv-opt.current:hover{border-color:var(--line);background:none;}
  .mv-opt .mv-mark{color:var(--star);margin-right:6px;}

  /* トグル */
  .toggle-btn{background:none;border:none;font-family:inherit;color:var(--ink-faint);font-size:11px;cursor:pointer;padding:0 4px;margin-right:4px;transition:transform 0.18s;display:inline-block;width:16px;text-align:center;}
  .toggle-btn:hover{color:var(--star);}
  .step-group.collapsed > *:not(.step-group-head){display:none;}
  .snode.collapsed > .schildren{display:none;}
  .snode.collapsed > .sadd-sub{display:none;}

  /* ジャーナルフィルタ */
  .trail-filter{margin-bottom:18px;}
  .trail-filter .tf-label{font-size:11px;color:var(--ink-faint);letter-spacing:0.14em;margin-bottom:10px;}
  .trail-filter .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .trail-filter .fchip{font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:16px;padding:7px 13px;transition:all 0.2s;cursor:pointer;}
  .trail-filter .fchip:hover{border-color:var(--star);color:var(--ink);}
  .trail-filter .fchip::before{content:'▸ ';color:var(--star);font-weight:700;opacity:0.7;}
  .trail-filter .fchip.on{background:rgba(201,162,39,0.12);border-color:var(--star);color:var(--ink);font-weight:700;}
  .trail-filter .fchip.on::before{content:'● ';color:var(--star);opacity:1;}
  .trail-filter-summary{font-size:11px;color:var(--ink-faint);margin-top:8px;letter-spacing:0.02em;}

  /* 価値観の全画面編集 */
  .vsheet-full{
    border-radius:0 !important;
    max-height:100% !important;
    max-width:none !important;
    width:100% !important;
    height:100% !important;
    inset:0 !important;
    transform:translateY(100%);
    transition:transform 0.4s cubic-bezier(.2,.8,.2,1) !important;
    padding:0 !important;
    visibility:visible !important;
    overflow:hidden !important;
    display:flex;
    flex-direction:column;
  }
  .vsheet-full.open{transform:translateY(0);}
  .vfull-inner{
    flex:1;overflow-y:auto;
    padding:60px 28px 40px;
    max-width:680px;width:100%;margin:0 auto;
    box-sizing:border-box;
  }
  .vfull-inner h2{font-size:26px;margin-bottom:6px;letter-spacing:0.01em;}
  .vfull-inner h2 input{font-size:26px !important;font-weight:800 !important;padding:8px 0 !important;}
  .vfull-inner .sword{margin-bottom:8px;}
  .vfull-inner label{display:block;margin:24px 0 10px;font-size:11px;}
  .vfull-inner #vDef{
    min-height:340px;
    font-size:15px;
    line-height:1.85;
    padding:18px 20px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:14px;
  }
  .vfull-inner #vDef:focus{border-color:var(--star);}
  .vfull-inner #vDef::placeholder{color:var(--ink-faint);opacity:0.7;line-height:1.85;}
  .vfull-inner .btn-full{margin-top:24px;padding:16px;font-size:14px;}
  .vclose-btn{
    position:absolute;top:14px;right:18px;
    background:none;border:none;
    font-family:inherit;font-size:26px;
    color:var(--ink-faint);
    width:38px;height:38px;
    border-radius:50%;
    cursor:pointer;
    z-index:10;
    line-height:1;
  }
  .vclose-btn:hover{background:var(--paper-warm);color:var(--ink);}
  /* カレンダータスク（task）：緑系で区別 */
  .vev.task{background:linear-gradient(150deg,#7a9b7a,#5e7e5e);box-shadow:0 1px 4px rgba(110,150,110,0.3);}
  .vad-chip.task{background:#7a9b7a;}
  .cal-dot.task{background:#7a9b7a;}
  .cal-item.task .cdot{background:#7a9b7a;}
  .cal-item.task .ci-dir{color:#7a9b7a;}
  /* タスクのチェックボックス */
  .task-check{flex-shrink:0;width:18px;height:18px;border:1.5px solid #7a9b7a;border-radius:5px;background:none;margin-right:8px;cursor:pointer;transition:all 0.2s;align-self:center;}
  .task-check:hover{background:rgba(122,155,122,0.15);}
  .task-check.done{background:#7a9b7a;}
  .task-check.done::after{content:'✓';color:#fff;font-size:13px;font-weight:700;display:block;text-align:center;line-height:15px;}
  /* テーマのタスク用チェックボックス（金色） */
  .task-check.step-check{border-color:var(--star);}
  .task-check.step-check:hover{background:rgba(201,162,39,0.15);}
  .cal-item.task.done .ci-task{text-decoration:line-through;color:var(--ink-faint);}
  .vev.task.done{opacity:0.5;}
  .vev.task .vev-check{display:inline-block;width:12px;height:12px;border:1.5px solid #fff;border-radius:3px;margin-right:5px;vertical-align:middle;background:transparent;}
  .vev.task.done .vev-check{background:#fff;}
  .vev.task.done .vev-t{text-decoration:line-through;}
  .cal-item.event .cdot{background:#6a8cb0;}
  .cal-item.event .ci-dir{color:#6a8cb0;}

  .detail-GOAL{font-size:10px;letter-spacing:0.28em;color:var(--star);text-transform:uppercase;font-weight:700;margin-bottom:4px;}
  .detail-dir{font-size:21px;font-weight:800;color:var(--ink);line-height:1.4;}
  .detail-memo{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin-top:10px;padding:12px 14px;background:var(--paper-warm);border-radius:10px;white-space:pre-wrap;word-wrap:break-word;}
  .steps-tree{margin:18px 0 6px;}
  .snode{margin-bottom:4px;}
  .srow{display:flex;align-items:flex-start;gap:9px;padding:9px 0;}
  .scheck{width:19px;height:19px;border-radius:6px;border:1.5px solid #c3bca8;flex-shrink:0;margin-top:1px;background:none;position:relative;transition:transform 0.2s;}
  .scheck:active{transform:scale(0.86);}
  .scheck.filling{border-color:var(--star);background:var(--star);animation:checkPop 0.6s cubic-bezier(.3,1.6,.5,1);}
  @keyframes checkPop{0%{transform:scale(1);}40%{transform:scale(1.4) rotate(15deg);}100%{transform:scale(1) rotate(0);}}
  .stext{flex:1;font-size:14px;color:var(--ink);line-height:1.5;}
  .stext .sdue{display:block;font-size:10.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:0.04em;}
  .stext .sdue.past{color:#a98b6a;}
  .smini{background:none;border:none;font-family:inherit;font-size:16px;color:var(--ink-faint);padding:2px 5px;line-height:1;flex-shrink:0;}
  .smini:active{color:#b4503e;}
  .smove{background:none;border:none;font-family:inherit;font-size:13px;color:var(--ink-faint);padding:1px 4px;line-height:1;flex-shrink:0;}
  .smove:active{color:var(--star);}
  .smove:disabled{opacity:0.2;}
  .sort-row{display:flex;justify-content:flex-end;margin-bottom:2px;}
  .sort-btn{background:none;border:1px solid var(--line);border-radius:14px;font-family:inherit;font-size:11.5px;color:var(--ink-soft);padding:6px 12px;letter-spacing:0.03em;}
  .sort-btn:active{border-color:var(--star);color:var(--star);}
  .schildren{margin-left:14px;padding-left:14px;border-left:1px solid var(--line);}
  .sadd-sub{background:none;border:none;font-family:inherit;font-size:11.5px;color:var(--ink-faint);margin:0 0 6px 28px;letter-spacing:0.03em;}
  .sadd-sub::before{content:'+ ';color:var(--star);}
  .sadd-root{font-family:inherit;width:100%;background:none;border:1px dashed var(--line);border-radius:13px;padding:13px;color:var(--ink-faint);font-size:13px;margin-top:6px;}
  .sadd-root .p{color:var(--star);font-weight:700;}

  .trail-star{margin-bottom:26px;}
  .trail-head{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line);cursor:pointer;}
  .trail-head:active{opacity:0.6;}
  .trail-head .name{font-size:15px;font-weight:700;color:var(--ink);}
  .trail-head .n{font-size:11px;color:var(--ink-faint);margin-left:auto;}
  .trail-head .hopen{font-size:10.5px;color:var(--star);letter-spacing:0.06em;opacity:0.7;margin-left:2px;}
  .trail-head:active .hopen{opacity:1;}
  .trail-line{position:relative;padding-left:24px;}
  .trail-line::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--star),var(--line));}
  .step{position:relative;padding:9px 0;display:flex;justify-content:space-between;gap:8px;}
  .step::before{content:'';position:absolute;left:-21px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--paper);border:1.5px solid var(--star);}
  .step .sbody .when{font-size:10.5px;color:var(--ink-faint);}
  .step .sbody .what{font-size:14px;color:var(--ink);margin-top:2px;line-height:1.6;}
  .step .stardel{background:none;border:none;color:var(--ink-faint);font-size:14px;flex-shrink:0;padding:2px 4px;align-self:center;opacity:0.45;}
  .step .stardel:active{color:#b4503e;opacity:1;}
  .step .stactions{display:flex;gap:0;align-self:center;flex-shrink:0;}
  .step.achieved{background:linear-gradient(90deg,rgba(201,162,39,0.07),transparent 80%);border-radius:10px;margin-left:-8px;padding-left:8px;}
  .step.achieved::before{width:10px;height:10px;left:-21.5px;background:var(--star);border-color:#f0e4b8;box-shadow:0 0 7px 1px rgba(201,162,39,0.5);}
  .step.achieved .what{font-weight:700;}
  .step.achieved .vmark{color:var(--star);font-size:12px;margin-left:6px;}
  .trail-more{background:none;border:none;font-family:inherit;font-size:12px;color:var(--star);letter-spacing:0.04em;margin-top:4px;padding-left:24px;}

  .empty{text-align:center;padding:44px 16px;color:var(--ink-faint);font-size:14px;line-height:1.9;}
  .empty .em-glyph{font-size:24px;color:var(--star-soft);display:block;margin-bottom:10px;}
  .section-note{font-size:11.5px;color:var(--ink-faint);text-align:center;padding:14px 0;line-height:1.7;}

  .weekly-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:center;margin-bottom:14px;}
  .weekly-card .wbig{font-size:34px;font-weight:800;color:var(--star);}
  .weekly-card .wlabel{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .weekly-soon{border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--ink-faint);font-size:12.5px;line-height:1.85;}

  .tabbar{flex-shrink:0;height:84px;padding-bottom:20px;background:rgba(244,241,234,0.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;}
  .tab{background:none;border:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);flex:1;padding-top:4px;cursor:pointer;}
  .tab .ic{font-size:20px;line-height:24px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-family:'M PLUS 1','Hiragino Sans',sans-serif;font-variant-emoji:text;}
  /* カレンダー▦は字面が左寄りなので微調整 */
  .tab[data-v="cal"] .ic{padding-left:1px;}
  .tab .lb{font-size:9px;letter-spacing:0.01em;}
  .tab.active{color:var(--star);}
  .tab.active .lb{font-weight:700;}

  .toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:all 0.35s;z-index:300;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .ts{color:var(--star-soft);}

  .confirm-bg{position:absolute;inset:0;background:rgba(20,22,28,0.5);z-index:400;display:none !important;align-items:center;justify-content:center;padding:30px;}
  .confirm-bg.open{display:flex !important;}
  .confirm{background:var(--paper);border-radius:18px;padding:24px 22px;width:100%;transform:scale(0.92);transition:transform 0.25s;}
  .confirm-bg.open .confirm{transform:scale(1);}
  .confirm h3{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:8px;}
  .confirm p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:18px;}
  .confirm-row{display:flex;gap:10px;}
  .confirm-row button{flex:1;font-family:inherit;border-radius:12px;padding:13px;font-size:14px;font-weight:700;border:none;}
  .cf-no{background:var(--paper-warm);color:var(--ink-soft);}
  .cf-yes{background:#b4503e;color:#fff;}
  .cf-yes:active,.cf-no:active{transform:scale(0.97);}

  .spark{position:absolute;pointer-events:none;z-index:95;opacity:0;will-change:transform,opacity;}
  .spark.go{animation:sparkFly 2.1s cubic-bezier(.2,.6,.3,1) forwards;}
  @keyframes sparkFly{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3) rotate(0);}18%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(14deg);}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0.7) rotate(var(--dr));}}
  .flash{position:absolute;pointer-events:none;width:80px;height:80px;border-radius:50%;z-index:90;background:radial-gradient(circle,rgba(255,247,214,0.9),rgba(227,212,160,0.6) 35%,rgba(201,162,39,0.2) 60%,transparent 75%);transform:translate(-50%,-50%) scale(0.2);opacity:0;}
  .flash.go{animation:flashPop 0.85s ease-out forwards;}
  @keyframes flashPop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.2);}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5);}}
  /* ===== zen overrides：白基調、引き算の禅デザイン ===== */
  body{background:#e8e5dc;}
  :root{
    --ink:#2d3038;
    --ink-soft:#6a6d75;
    --ink-faint:#a0a3ab;
    --line:#e4e0d3;
    --line-soft:#efebdf;
    --paper:#ffffff;
    --card:#ffffff;
    --paper-warm:#fbfaf6;
    --star:#a8893f;
    --star-soft:#c4b78a;
  }
  /* iPhone枠の中身を真っ白に */
  .phone{background:#ffffff;}

  /* ===== フォント：全部細く、密度を下げる ===== */
  /* タイトル・タブ・見出しは GenJyuuGothic L（源柔）でやわらかく */
  .titlebar h1, h1, h2, .tab .lb, .lcard .word, .star-dir, .detail-dir, .star-meta, .star-open-hint, .sub, .chip-label, .field-label{
    font-family:'GenJyuuGothicL','Zen Maru Gothic','Hiragino Sans','M PLUS 1',sans-serif;
  }
  body, input, textarea, select, button, .lcard *, .step *, .titlebar *{
    font-weight:300;
    letter-spacing:0.02em;
  }
  /* タイトル：細く、控えめに */
  .titlebar h1, h1{
    font-weight:400 !important;
    font-size:24px !important;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  h2{font-weight:400 !important;letter-spacing:0.02em;}
  .titlebar .sub, .sub{
    font-size:10px;
    color:var(--ink-faint);
    font-weight:300;
    letter-spacing:0.2em;
    margin-top:8px;
  }
  /* テーマ名・タスク名は中くらいの太さ */
  .lcard .word, .star-dir, .detail-dir, .ci-task, .step .what{
    font-weight:400 !important;
    letter-spacing:0.01em;
  }
  /* リード文・補助テキストは超軽く */
  .lead, .due-note, .hint, .empty, .section-note, .cal-day-label, .star-meta, .star-open-hint{
    font-weight:300;
    line-height:2;
    color:var(--ink-soft);
  }

  /* ===== タブバー：左下のタブも細く ===== */
  .tabbar{
    background:rgba(255,255,255,0.94);
    border-top:1px solid var(--line);
  }
  .tab{color:var(--ink-faint);}
  .tab .lb{font-weight:300 !important;letter-spacing:0.05em;}
  .tab.active{color:var(--star);}
  .tab.active .lb{font-weight:400 !important;}
  .tab.active .ic{color:var(--star);}

  /* タイトルバー右上のボタン（仮置き・アーカイブ） */
  .archive-btn{font-weight:300;color:var(--ink-faint);}
  .archive-btn:active{color:var(--star);}

  /* ===== 英字ラベル（GOAL, VALUE, INBOX等）：ほぼ消えそうに薄く ===== */
  .sword, .detail-toward, .star-toward, .field-label, .chip-label{
    font-weight:300 !important;
    font-size:9px !important;
    letter-spacing:0.35em !important;
    color:var(--ink-faint) !important;
    text-transform:uppercase;
    opacity:0.7;
  }

  /* ===== カード・入力欄：枠線撤去、下線だけ ===== */
  .lcard{
    border:none;
    background:transparent;
    border-bottom:1px solid var(--line);
    border-radius:0;
    padding:28px 4px;
  }
  .lcard:first-child{border-top:1px solid var(--line);}
  .lcards{gap:0;margin-bottom:24px;}
  .lcard .word{font-size:17px;}
  .star-dir{font-size:18px;}
  .star-meta{font-size:11px;color:var(--ink-faint);margin-top:8px;letter-spacing:0.04em;}
  .star-open-hint{font-size:10px;color:var(--ink-faint);letter-spacing:0.2em;text-transform:uppercase;margin-top:14px;}

  /* 入力欄：枠を細く、もしくは下線だけ */
  input[type=text], input[type=date], input[type=number], select{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    padding:10px 2px;
    font-weight:300;
    color:var(--ink);
  }
  textarea{
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    font-weight:300;
    color:var(--ink);
    line-height:1.85;
  }
  textarea:focus, input:focus, select:focus{
    border-bottom-color:var(--star);
    border-color:var(--star);
    outline:none;
  }
  ::placeholder{color:var(--ink-faint);opacity:0.6;font-weight:300;}

  /* ===== ボタン ===== */
  .btn-full{
    background:var(--ink);
    color:#fdfcf8;
    border:none;
    border-radius:4px;
    padding:15px;
    font-weight:400;
    letter-spacing:0.12em;
    font-size:12px;
  }
  .btn-ghost{font-weight:300;color:var(--ink-soft);}
  .vcustom-btn, .sadd-root{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    color:var(--ink-soft);
    padding:18px 4px;
    text-align:left;
    font-weight:300;
    letter-spacing:0.02em;
  }
  .vcustom-btn:hover, .sadd-root:hover{
    color:var(--star);
    border-bottom-color:var(--star);
  }
  .vcustom-btn .p, .sadd-root .p{
    color:var(--star);
    font-weight:400;
  }

  /* ===== チップ（ことばの候補） ===== */
  .chip{
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    border-radius:0;
    padding:6px 0;
    margin-right:24px;
    font-weight:300;
    color:var(--ink-soft);
    font-size:13px;
    transition:all 0.5s ease;
  }
  .chip:hover, .chip:active{
    background:transparent;
    border-bottom-color:var(--star);
    color:var(--ink);
  }
  .chip::before{color:var(--ink-faint);font-weight:300;}
  .chips{gap:0;}
  .chip-zone{margin-bottom:48px;}

  /* ===== ステップ・サブタスク ===== */
  .scheck{border-color:var(--star);}
  .stext{font-weight:300;}
  .step .what{font-weight:300;font-size:13px;}
  .schildren{border-left:1px solid var(--line);}

  /* ===== 軌跡（ジャーナル） ===== */
  .trail-star{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    padding:24px 4px;
    margin-bottom:0;
  }
  .trail-head{
    border-bottom:none;
    padding-bottom:14px;
    margin-bottom:10px;
  }
  .trail-head .name{font-weight:400;font-size:13px;color:var(--ink);}
  .trail-head .n{font-size:10px;color:var(--ink-faint);letter-spacing:0.1em;}
  .step{padding:12px 0;}
  .step .what{font-weight:300;}
  .step::before{border-color:var(--star-soft);}

  /* ===== カレンダー ===== */
  .mt-bar{font-weight:400;letter-spacing:0;}
  .cal-cell{border-color:transparent;}
  .cal-cell.has{background:transparent;}
  .cal-cell.today{border-color:var(--star);}
  .cal-cell .dn{font-weight:300;}
  .cal-cell.today .dn{font-weight:500;}
  .cal-dow{font-weight:300;color:var(--ink-faint);letter-spacing:0.1em;}

  /* ===== シート ===== */
  .sheet{
    padding:32px 26px 36px;
    border-radius:14px 14px 0 0;
    background:var(--paper);
  }
  .sheet h2{font-weight:400;font-size:18px;margin-bottom:10px;}
  .grip{background:var(--line);}

  /* ===== 仮置きの入力 ===== */
  .inbox-input-row{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    padding:4px 2px;
    margin-top:12px;
  }
  .inbox-input-row:focus-within{border-bottom-color:var(--star);}
  #inboxInput{font-weight:300;background:transparent;}
  .inbox-hint{font-weight:300;color:var(--ink-faint);letter-spacing:0.04em;}

  /* ===== セクション間の余白を全体に広げる ===== */
  .screen{padding:24px 22px 60px;}
  .titlebar{padding:32px 22px 20px;}
  .lead{font-size:12.5px;margin-bottom:32px;}

  /* テーマ詳細のアーカイブメニュー */
  .archive-zone{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);}
  .archive-toggle{
    background:none;border:none;font-family:inherit;
    color:var(--ink-faint);font-size:11px;
    letter-spacing:0.25em;text-transform:uppercase;
    font-weight:300;padding:6px 0;cursor:pointer;
    transition:color 0.3s ease;
  }
  .archive-toggle:hover{color:var(--star);}
  .archive-menu{margin-top:8px;display:flex;flex-direction:column;gap:0;}
  .archive-item{
    background:none;border:none;font-family:inherit;
    text-align:left;padding:14px 4px;
    color:var(--ink-soft);font-weight:300;font-size:13px;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;letter-spacing:0.04em;
    transition:color 0.3s ease;
  }
  .archive-item:hover{color:var(--star);}
  .archive-item.danger:hover{color:#b85555;}

  /* テーマカードのトグル＋カテゴリ表示 */
  .lcard-head{display:flex;align-items:center;gap:6px;}
  .lcard-head .toggle-btn{font-size:10px;padding:2px 6px 2px 0;color:var(--ink-faint);}
  .lcard.collapsed{padding-bottom:24px;}
  .lcard .pvgroup{color:var(--star);font-weight:300;letter-spacing:0.02em;}
  .lcard .pvcount{color:var(--ink-faint);font-size:11px;margin-left:6px;letter-spacing:0.05em;}
  .pvgroup-row{display:flex;align-items:center;gap:4px;}
  .pv-toggle{background:none;border:none;font-family:inherit;color:var(--ink-faint);font-size:9px;cursor:pointer;padding:0;width:14px;text-align:center;flex-shrink:0;}
  .pv-toggle:hover{color:var(--star);}
  .pv-toggle-spacer{display:inline-block;width:14px;flex-shrink:0;}
  .pvrow-nested{padding-left:20px;}
  /* テーマカード内タスクのチェックボックス（□） */
  .pv-check{
    width:16px;height:16px;
    border:1px solid var(--star);
    border-radius:3px;
    background:transparent;
    padding:0;cursor:pointer;
    flex-shrink:0;margin-right:8px;
    transition:background 0.2s ease;
  }
  .pv-check:hover{background:rgba(168,137,63,0.15);}
  .pv-task-text{flex:1;}

  /* 記録タブのテーマ選び：価値観タイトルと同じフォントに */
  #v-log select{font-family:'GenJyuuGothicL','Zen Maru Gothic','Hiragino Sans','M PLUS 1',sans-serif;font-size:15px;font-weight:400;}

  .archive-btn.active{color:var(--star);}
  /* 全シート共通の主張しない閉じるボタン */
  .sheet-close-mini{
    position:absolute;top:14px;right:14px;
    background:none;border:none;
    font-family:inherit;font-size:18px;font-weight:300;
    color:var(--ink-faint);
    width:32px;height:32px;cursor:pointer;
    padding:0;border-radius:50%;
    z-index:50;line-height:1;
    transition:color 0.2s ease;
  }
  .sheet-close-mini:hover{color:var(--ink);}
  /* シート自体が position:relative になっていないことが多いので、absolute起点を確保 */
  .sheet{position:absolute;}
  /* ジャーナルモード切替セグメント */
  .trail-mode-seg{display:flex;background:transparent;padding:0;margin-bottom:18px;gap:0;border-bottom:1px solid var(--line);}
  .trail-mode-seg .seg{flex:1;background:none;border:none;font-family:inherit;font-size:12px;color:var(--ink-faint);font-weight:300;padding:10px 0;cursor:pointer;border-bottom:1px solid transparent;letter-spacing:0.1em;margin-bottom:-1px;}
  .trail-mode-seg .seg.active{color:var(--ink);border-bottom-color:var(--star);font-weight:400;}
  /* ジャーナル日付順 */
  .trail-year{margin-bottom:32px;}
  .trail-year-label{font-size:11px;color:var(--ink-faint);letter-spacing:0.25em;font-weight:400;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .trail-date-group{margin-bottom:20px;}
  .trail-date-label{font-size:11px;color:var(--ink-soft);letter-spacing:0.06em;padding:8px 0 4px;font-weight:400;}
  .trail-dir-tag{margin-left:8px;font-size:10px;color:var(--star);font-weight:300;letter-spacing:0.05em;}
  .trail-dir-tag.muted{color:var(--ink-faint);}
  /* 並べ替えモード */
  .lcard.reorder-mode{padding:18px 4px;}
  .lcard.reorder-mode .lcard-head{justify-content:space-between;}
  .reorder-arrows{display:flex;gap:4px;}
  .reorder-up, .reorder-down{
    background:none;border:1px solid var(--line);font-family:inherit;
    color:var(--ink-soft);font-size:14px;
    width:34px;height:34px;cursor:pointer;border-radius:6px;
    transition:all 0.2s ease;
  }
  .reorder-up:hover, .reorder-down:hover{border-color:var(--star);color:var(--star);}
  .reorder-up:disabled, .reorder-down:disabled{opacity:0.3;cursor:default;}

  /* スクロールバー */
  ::-webkit-scrollbar{width:0;background:transparent;}
</style>
</head>
<body>
<div class="phone">
  <div class="titlebar">
    <div class="tleft">
      <h1 id="screenTitle">価値観</h1>
      <div class="sub" id="screenSub">自分が大事にしたいこと</div>
    </div>
    <div class="title-right" id="titleRight">
      <button class="archive-btn" id="reorderBtn" style="display:none;">入れ替え</button>
      <button class="archive-btn" id="inboxBtn" style="display:none;">仮置き</button>
      <button class="archive-btn" id="archiveBtn" style="display:none;">アーカイブ</button>
    </div>
  </div>

  <div class="screen">
    <section class="view active" id="v-values">
      
      <div class="chip-zone" id="chipZone"><div class="chip-label">こんなことば、どうですか</div><div class="chips" id="chips"></div></div>
      <div class="lcards" id="vcards"></div>
      <button class="vcustom-btn" id="addValue"><span class="p">+</span> 自分のことばを作る</button>
    </section>

    <section class="view" id="v-stars">
      
      <div class="lcards" id="starsList"></div>
      <div class="inbox-input-row" style="margin-top:8px;">
        <input type="text" id="inboxInput" placeholder="仮置きタスクを追加（+ Enter）" autocomplete="off">
        <button class="inbox-more" id="inboxMore" title="詳しく書く">⋯</button>
      </div>
      
      <button class="vcustom-btn" id="addStar" style="margin-top:14px;"><span class="p">+</span> 新しいテーマを追加</button>
      
    </section>

    <section class="view" id="v-log">
      <textarea id="diffText" placeholder="" style="width:100%;min-height:120px;"></textarea>
      <div style="margin-top:14px;"><select id="diffStar"><option value="">（未分類）</option></select></div>
      <div id="diffGroupZone" style="margin-top:10px;display:none;"><select id="diffGroup"><option value="">— 未分類</option></select></div>
      <div id="diffMetrics" style="margin-top:10px;"></div>
      <button class="btn-full" id="addDiff" style="margin-top:18px;">記録</button>
    </section>

    <section class="view" id="v-trail">
      <div class="trail-mode-seg">
        <button class="seg active" data-trailmode="theme">テーマ別</button>
        <button class="seg" data-trailmode="date">日付順</button>
      </div>
      <div class="trail-filter" id="trailFilter"></div>
      <div id="trailBody"></div>
    </section>

    <section class="view" id="v-cal">
      
      <div class="cal-seg" id="calSeg">
        <button class="seg active" data-mode="month">月</button>
        <button class="seg" data-mode="week">3日</button>
        <button class="seg" data-mode="day">日</button>
      </div>
      <div class="cal-head"><button class="cal-nav" id="calPrev">‹</button><div class="cal-mo" id="calMonth">—</div><button class="cal-nav" id="calNext">›</button></div>
      <div id="calMonthView"><div class="cal-grid" id="calGrid"></div><div class="cal-list" id="calList"></div></div>
      <div id="calWeekView" style="display:none;"></div>
      <div id="calDayView" style="display:none;"></div>
      <button class="vcustom-btn" id="addEvent" style="margin-top:16px;"><span class="p">+</span> 予定を追加</button>
    </section>

    <section class="view" id="v-week">
      
      <div class="weekly-card"><div class="wbig" id="weekCount">0</div><div class="wlabel">この7日間で動いた記録</div></div>
      <div id="metricsBlock"></div>
    </section>

    <section class="view" id="v-archive">
      
      <div id="archiveBody"></div>
      <button class="btn-ghost" id="archiveBack" style="margin-top:20px;">← 戻る</button>
    </section>
  </div>

  <div class="tabbar">
    <button class="tab active" data-v="values"><span class="ic">◆&#xFE0E;</span><span class="lb">価値観</span></button>
    <button class="tab" data-v="stars"><span class="ic">★&#xFE0E;</span><span class="lb">テーマ</span></button>
    <button class="tab" data-v="log"><span class="ic">✎&#xFE0E;</span><span class="lb">記録</span></button>
    <button class="tab" data-v="trail"><span class="ic">✦&#xFE0E;</span><span class="lb">ジャーナル</span></button>
    <button class="tab" data-v="cal"><span class="ic">▦&#xFE0E;</span><span class="lb">カレンダー</span></button>
    <button class="tab" data-v="week"><span class="ic">◐&#xFE0E;</span><span class="lb">振り返り</span></button>
  </div>

  <div class="sheet-bg" id="vbg"></div>
  <div class="sheet vsheet-full" id="vsheet">
    <button class="vclose-btn" id="vClose" title="閉じる">×</button>
    <div class="vfull-inner">
      <h2 id="vWord">—</h2>
      <label>あなたの言葉で</label>
      <textarea id="vDef" placeholder=""></textarea>
      <button class="btn-full" id="vSave">保存</button>
      <div class="archive-zone" id="vArchiveZone" style="display:none;">
        <button class="archive-toggle" id="vArchiveToggle">アーカイブ</button>
        <div class="archive-menu" id="vArchiveMenu" style="display:none;">
          <button class="archive-item" id="vArchive">過去の価値観として残す</button>
          <button class="archive-item danger" id="vDelete">完全に削除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-bg" id="dbg"></div>
  <div class="sheet" id="dsheet">
    <div class="grip"></div>
    <div class="detail-dir" id="dDir">—</div>
    <div class="detail-memo" id="dMemo" style="display:none;"></div>
    <button class="btn-ghost" id="dEdit" style="margin-top:4px;padding:6px;font-size:12px;color:var(--star);">このテーマを編集 ›</button>
    <div class="metrics-on-star" id="metricsOnStar"></div>
    <div class="sort-row" style="margin-top:14px;"><button class="sort-btn" id="sortByDue">期日順に整える</button></div>
    <div class="steps-tree" id="stepsTree"></div>
    <button class="sadd-root" id="addRootStep"><span class="p">+</span> タスクを追加する</button>
    <button class="sadd-root" id="addGroup" style="margin-top:8px;"><span class="p">+</span> カテゴリを追加（例：運動・食事）</button>
    <div class="archive-zone">
      <button class="archive-toggle" id="archiveToggle">アーカイブ</button>
      <div class="archive-menu" id="archiveMenu" style="display:none;">
        <button class="archive-item" id="dArchive">達成</button>
        <button class="archive-item" id="dHold">保留</button>
        <button class="archive-item danger" id="dDelete">削除</button>
      </div>
    </div>
  </div>

  <!-- star create/edit sheet -->
  <div class="sheet-bg" id="ssbg"></div>
  <div class="sheet" id="sssheet">
    <div class="grip"></div>
    <div class="sword" id="starKind">NEW</div>
    <h2 style="font-size:19px;" id="starHead">新しいテーマを追加</h2>
    <label>テーマ</label>
    <input type="text" id="starDir" placeholder="テーマ／ありたい姿／目標" style="margin-top:6px;">
    

    <label style="display:block;margin-top:14px;">メモ</label>
    <textarea id="starMemo" style="min-height:70px;margin-top:6px;" placeholder=""></textarea>

    <label style="display:block;margin-top:18px;">数値の指標（任意）</label>
    
    <div id="starMetricsEditor"></div>
    <button class="vcustom-btn" id="addStarMetric" style="margin-top:6px;"><span class="p">+</span> グラフ追加</button>

    <button class="btn-full" id="starSave" style="margin-top:18px;">置く</button>
  </div>

  <div class="sheet-bg" id="sbg"></div>
  <div class="sheet" id="ssheet">
    <div class="grip"></div>
    <div class="sword" id="stepKind">STEP</div>
    <h2 style="font-size:17px;" id="stepHead">タスクを追加</h2>
    <label>やること</label>
    <textarea id="stepText" style="min-height:60px;" placeholder="例：過去問を10年分そろえる"></textarea>

    <label style="display:block;margin-top:14px;">メモ</label>
    <textarea id="stepMemo" style="min-height:54px;" placeholder="補足や、やり方のメモなど"></textarea>

    <label style="display:block;margin-top:14px;">いつ</label>
    <div class="due-row"><input type="date" id="stepDue"><button class="due-clear" id="stepDueClear">なし</button></div>
    <div class="time-row" id="timeRow">
      <input type="text" id="stepFrom" inputmode="numeric" placeholder="9:00" maxlength="5"><span class="time-sep">〜</span><input type="text" id="stepTo" inputmode="numeric" placeholder="10:00" maxlength="5">
    </div>
    <div class="dur-row">
      <span class="dur-label">所要：<span id="stepDurCalc">—</span></span>
      <div class="dur-presets">
        <button class="dur-p" data-stepdur="15">15分</button>
        <button class="dur-p" data-stepdur="30">30分</button>
        <button class="dur-p" data-stepdur="60">1時間</button>
        <button class="dur-p" data-stepdur="120">2時間</button>
      </div>
    </div>
    <input type="hidden" id="stepDur">
    

    <label style="display:block;margin-top:14px;">繰り返し</label>
    <div class="rep-row" id="repRow">
      <button class="rep-opt active" data-rep="none">なし</button>
      <button class="rep-opt" data-rep="daily">毎日</button>
      <button class="rep-opt" data-rep="weekly">毎週</button>
      <button class="rep-opt" data-rep="monthly">毎月</button>
    </div>
    <div class="weekday-row" id="weekdayRow" style="display:none;">
      <button class="wd" data-wd="0">日</button><button class="wd" data-wd="1">月</button><button class="wd" data-wd="2">火</button><button class="wd" data-wd="3">水</button><button class="wd" data-wd="4">木</button><button class="wd" data-wd="5">金</button><button class="wd" data-wd="6">土</button>
    </div>
    <div class="monthday-zone" id="monthDayZone" style="display:none;">
      
      <div class="monthday-grid" id="monthDayGrid"></div>
    </div>
    <div class="due-note" id="repNote" style="display:none;">繰り返し設定中です。</div>
    

    <button class="btn-full" id="stepSave">追加</button>
  </div>

  <!-- complete-with-note sheet -->
  <div class="sheet-bg" id="cbg"></div>
  <div class="sheet" id="csheet">
    <div class="grip"></div>
    <div class="sword">DONE</div>
    <h2 style="font-size:18px;" id="cTask">—</h2>
    <div id="cMetricZone" style="display:none;margin-bottom:14px;"></div>
    <label>ひとこと残す（任意）</label>
    <textarea id="cNote" placeholder="その日の手応え、気づき、なんでも。空でもいい。"></textarea>
    <button class="btn-full" id="cConfirm">成し遂げた ★</button>
    <button class="btn-ghost" id="cSkipNote">メモなしで記録</button>
  </div>

  <!-- metric editor sheet -->
  <div class="sheet-bg" id="mbg"></div>
  <div class="sheet" id="msheet">
    <div class="grip"></div>
    <div class="sword" id="metricKind">METRIC</div>
    <h2 style="font-size:18px;" id="metricHead">グラフ追加</h2>
    <label>なんの指標？</label>
    <input type="text" id="metricName" placeholder="例：体重／模試の点数／貯金額／本を読んだ数" style="margin-top:6px;">

<script>
// window.storage が無い環境(普通のブラウザ)では localStorage で代用する
if(typeof window.storage==='undefined'||!window.storage){
  window.storage={
    get:async(key)=>{
      try{const v=localStorage.getItem(key);return v==null?null:{key,value:v};}catch(e){return null;}
    },
    set:async(key,value)=>{
      try{localStorage.setItem(key,value);return {key,value};}catch(e){return null;}
    },
    delete:async(key)=>{try{localStorage.removeItem(key);return {key,deleted:true};}catch(e){return null;}},
    list:async(prefix)=>{
      try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!prefix||k.startsWith(prefix))keys.push(k);}return {keys,prefix};}catch(e){return null;}
    }
  };
}
const K={v:'polaris:values',s:'polaris:stars',d:'polaris:diffs',va:'polaris:values_arch',sa:'polaris:stars_arch',sh:'polaris:stars_hold',ev:'polaris:events',ml:'polaris:metric_logs',ib:'polaris:inbox'};
// 仮置き：テーマと同じ構造（steps, groups）を持つ単一オブジェクト
let inbox={id:'__inbox__',steps:[],groups:[]};
let values=[], stars=[], diffs=[], valuesArch=[], starsArch=[], starsHold=[], events=[], metricLogs=[];
const SEED=['ロールモデル','理想的な職場','10年後','大事にしたい時間','機嫌よくいられる条件','ゆずれないこと','憧れの人','心地よい暮らし','手放したいこと','すり減ること'];
const TITLES={
  values:['価値観','自分が大事にしたいこと'],
  stars:['テーマ','テーマとタスクを管理'],
  log:['記録','やったこと / 気づき / 感想'],
  trail:['ジャーナル','記録'],
  cal:['カレンダー',''],
  week:['振り返り',''],
  archive:['アーカイブ','達成・保留・過去の価値観']
};

// テーマカードの折りたたみ状態（永続化）
let collapsedStarCards={};
let collapsedStarGroups={}; // テーマカード内のカテゴリ展開状態 {"sid::gid": true}
async function saveCollapsedStarCards(){
  try{
    await window.storage.set('polaris:collapsed_stars',JSON.stringify(collapsedStarCards));
    await window.storage.set('polaris:collapsed_stargroups',JSON.stringify(collapsedStarGroups));
  }catch(e){}
}
async function loadCollapsedStarCards(){
  try{const r=await window.storage.get('polaris:collapsed_stars');if(r)collapsedStarCards=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get('polaris:collapsed_stargroups');if(r)collapsedStarGroups=JSON.parse(r.value);}catch(e){}
}

async function load(){
  try{const r=await window.storage.get(K.v);if(r)values=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.s);if(r)stars=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.d);if(r)diffs=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.va);if(r)valuesArch=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.sa);if(r)starsArch=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.sh);if(r)starsHold=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.ev);if(r)events=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.ml);if(r)metricLogs=JSON.parse(r.value);}catch(e){}
  try{const r=await window.storage.get(K.ib);if(r){const o=JSON.parse(r.value);inbox.steps=o.steps||[];inbox.groups=o.groups||[];}}catch(e){}
  await loadCollapsed();
  await loadCollapsedStarCards();
  values=values||[];stars=stars||[];diffs=diffs||[];valuesArch=valuesArch||[];starsArch=starsArch||[];starsHold=starsHold||[];events=events||[];metricLogs=metricLogs||[];
  // 旧データ正規化：tasks→steps、children補完
  stars.forEach(s=>{
    if(!s.steps){
      s.steps=(s.tasks||[]).filter(t=>!t.done).map(t=>({id:t.id||uid(),text:t.text,due:t.due||null,done:false,children:[]}));
      delete s.tasks;
    }
    const fix=arr=>arr&&arr.forEach(st=>{if(!st.children)st.children=[];fix(st.children);});
    fix(s.steps);
  });
  renderAll();
}
async function save(k,val){try{await window.storage.set(K[k],JSON.stringify(val));}catch(e){}}
const sv=()=>save('v',values), ss=async()=>{await save('s',stars);await save('ib',{steps:inbox.steps,groups:inbox.groups});}, sd=()=>save('d',diffs), sva=()=>save('va',valuesArch), ssa=()=>save('sa',starsArch), ssh=()=>save('sh',starsHold), sev=()=>save('ev',events), sml=()=>save('ml',metricLogs), sib=()=>save('ib',{steps:inbox.steps,groups:inbox.groups});
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function linkify(s){
  // esc済みの文字列に対して使う。URLを<a>に変換
  return s.replace(/(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener" class="ulink">$1</a>');
}
function escLink(s){return linkify(esc(s||''));}
function fmtDate(ts){const d=new Date(ts);const w=['日','月','火','水','木','金','土'];return `${d.getMonth()+1}.${d.getDate()} (${w[d.getDay()]})`;}
function isPast(due){return new Date(due+'T23:59:59').getTime()<Date.now();}
function fmtDue(due){const d=new Date(due+'T00:00:00');const w=['日','月','火','水','木','金','土'];return `▸ ${d.getMonth()+1}月${d.getDate()}日(${w[d.getDay()]})`;}
function toast(m){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

let cfResolve=null;
function confirmAsk(title,msg){
  document.getElementById('cfTitle').textContent=title;
  document.getElementById('cfMsg').innerHTML=msg;
  document.getElementById('confirmBg').classList.add('open');
  return new Promise(res=>{cfResolve=res;});
}
document.getElementById('cfYes').onclick=()=>{document.getElementById('confirmBg').classList.remove('open');cfResolve&&cfResolve(true);};
document.getElementById('cfNo').onclick=()=>{document.getElementById('confirmBg').classList.remove('open');cfResolve&&cfResolve(false);};

/* VALUES */
function renderValues(){
  const used=values.map(v=>v.word);
  const remain=SEED.filter(w=>!used.includes(w));
  const cz=document.getElementById('chipZone');
  if(remain.length){cz.style.display='block';document.getElementById('chips').innerHTML=remain.map(w=>`<button class="chip" data-chip="${esc(w)}">${esc(w)}</button>`).join('');}
  else cz.style.display='none';
  document.getElementById('vcards').innerHTML=values.map(v=>{
    const def=v.def?`<div class="def">${esc(v.def)}</div>`:`<div class="def empty">タップして、自分の言葉で</div>`;
    const badge=v.def?`<span class="badge">★</span>`:'';
    return `<div class="lcard" data-vid="${v.id}">${badge}<div class="word">${esc(v.word)}</div>${def}</div>`;
  }).join('');
}
let editVid=null;
function openValue(v){
  editVid=v?v.id:null;
  document.getElementById('vWord').innerHTML=v?esc(v.word):'<input type="text" id="newWordInput" placeholder="新しい言葉" style="font-size:19px;font-weight:600;padding:8px 0;border:none;border-bottom:1px solid var(--line);border-radius:0;">';
  document.getElementById('vDef').value=v?(v.def||''):'';
  document.getElementById('vArchiveZone').style.display=v?'block':'none';
  document.getElementById('vArchiveMenu').style.display='none';
  openSheet('vbg','vsheet');
}
document.getElementById('vArchiveToggle').addEventListener('click',()=>{
  const m=document.getElementById('vArchiveMenu');
  m.style.display=m.style.display==='none'?'flex':'none';
});

/* STARS */
function countMoves(id){return diffs.filter(d=>d.starId===id).length;}
function countOpenSteps(steps){let n=0;(steps||[]).forEach(st=>{if(!st.done)n++;n+=countOpenSteps(st.children);});return n;}
function countOpenAll(s){
  let n=countOpenSteps(s.steps||[]);
  (s.groups||[]).forEach(g=>{n+=countOpenSteps(g.steps||[]);});
  return n;
}
function renderStars(){
  const l=document.getElementById('starsList');
  if(!stars.length){l.innerHTML=`<div class="empty"><span class="em-glyph">☆</span><br></div>`;return;}
  l.innerHTML=stars.map((s,si)=>{
    const isCol=collapsedStarCards[s.id];
    const tri=isCol?'▶':'▼';
    // 直下のタスク
    const top=(s.steps||[]);
    // カテゴリ
    const groups=(s.groups||[]);
    // 並べ替えモード時は↑↓ボタンのみ表示、カード中身は隠す
    if(reorderMode){
      const upDis=si===0?'disabled':'';
      const downDis=si===stars.length-1?'disabled':'';
      return `<div class="lcard reorder-mode" data-sid="${s.id}"><div class="lcard-head"><div class="star-dir">${esc(s.dir)}</div><div class="reorder-arrows"><button class="reorder-up" data-reorderup="${s.id}" ${upDis}>↑</button><button class="reorder-down" data-reorderdown="${s.id}" ${downDis}>↓</button></div></div></div>`;
    }
    let body='';
    if(!isCol){
      let parts=[];
      // カテゴリ一覧（▼/▶ カテゴリ名 (N)）— 展開可能
      groups.forEach(g=>{
        const openSteps=g.steps||[];
        const n=countOpenSteps(openSteps);
        const gKey=`${s.id}::${g.id}`;
        const gCol=collapsedStarGroups[gKey];
        const gTri=openSteps.length?(gCol?'▶':'▼'):' ';
        parts.push(`<div class="pvrow pvgroup-row">${openSteps.length?`<button class="pv-toggle" data-togglestargroup="${gKey}">${gTri}</button>`:'<span class="pv-toggle-spacer"></span>'}<span class="pvgroup">${esc(g.name)}</span>${n?`<span class="pvcount">(${n})</span>`:''}</div>`);
        if(!gCol && openSteps.length){
          openSteps.forEach((st,i)=>{
            let due='';
            if(st.due){const past=isPast(st.due);due=`<span class="pvdue${past?' past':''}">${fmtDue(st.due)}</span>`;}
            const cbId=`${s.id}::${encPath(['g',g.id,i])}`;
            parts.push(`<div class="pvrow pvrow-nested"><button class="pv-check" data-sccheck="${cbId}"></button><span class="pv-task-text">${esc(st.text)}</span>${due}</div>`);
          });
        }
      });
      // 直下のタスク（最大3件）
      const shown=top.slice(0,3);
      shown.forEach((st,i)=>{
        let due='';
        if(st.due){const past=isPast(st.due);due=`<span class="pvdue${past?' past':''}">${fmtDue(st.due)}</span>`;}
        const cbId=`${s.id}::${encPath([i])}`;
        parts.push(`<div class="pvrow"><button class="pv-check" data-sccheck="${cbId}"></button><span class="pv-task-text">${esc(st.text)}</span>${due}</div>`);
      });
      if(top.length>3)parts.push(`<div class="pvmore">ほか ${top.length-3} 件…</div>`);
      if(parts.length)body=`<div class="star-preview">${parts.join('')}</div>`;
      body+=`<div class="star-open-hint">タップしてタスクを組む</div>`;
    }
    return `<div class="lcard${isCol?' collapsed':''}" data-sid="${s.id}"><div class="lcard-head"><button class="toggle-btn" data-togglestar="${s.id}">${tri}</button><div class="star-dir">${esc(s.dir)}</div></div>${body}</div>`;
  }).join('');
}
let reorderMode=false;
let detailSid=null;
// detailSid が __inbox__ なら inbox オブジェクトを、それ以外は対応する star を返す
function getContainer(sid){
  if(sid==='__inbox__')return inbox;
  return stars.find(x=>x.id===sid);
}
async function saveContainer(sid){
  if(sid==='__inbox__')return sib();
  return ss();
}
function openDetail(s){
  detailSid=s.id;
  document.getElementById('dDir').textContent=s.dir;
  const memoEl=document.getElementById('dMemo');
  if(s.memo){memoEl.textContent=s.memo;memoEl.style.display='block';}
  else{memoEl.style.display='none';}
  document.getElementById('archiveMenu').style.display='none';
  renderStepsTree();renderMetricsOnStar();openSheet('dbg','dsheet');
}

function renderMetricsOnStar(){
  const box=document.getElementById('metricsOnStar');if(!box)return;
  const s=getContainer(detailSid);if(!s){box.innerHTML='';return;}
  const ms=(s.metrics||[]);
  if(!ms.length){box.innerHTML='';return;}
  const glyph={up:'↗',down:'↘',sum:'∑',flat:'—'};
  box.innerHTML=ms.map(m=>{
    const logs=metricLogs.filter(l=>l.starId===detailSid&&l.metricId===m.id).sort((a,b)=>b.ts-a.ts);
    let cur='—';
    if(logs.length){
      if(m.kind==='sum')cur=logs.reduce((a,b)=>a+b.val,0);
      else cur=logs[0].val;
    }

function fmtTime(st){
  let parts=[];
  if(st.from){parts.push(st.to?`${st.from}〜${st.to}`:`${st.from}〜`);}
  if(st.dur)parts.push(`${st.dur}分`);

}
function repLabel(st){
  if(!st.rep||st.rep==='none')return '';
  if(st.rep==='daily')return '毎日';
  if(st.rep==='monthly')return '毎月';
  if(st.rep==='weekly'){

    return '毎週';
  }

}
function renderStepNodes(steps,path){
  return steps.map((st,i)=>{
    const p=encPath(path.concat(i));
    let meta=[];
    if(st.due){const past=isPast(st.due);meta.push(`<span class="${past?'past':''}" style="${past?'color:#a98b6a;':''}">${fmtDue(st.due)}${past?'（過ぎました）':''}</span>`);}
    const tm=fmtTime(st);if(tm)meta.push(tm);
    const metaLine=meta.length?`<span class="smeta">${meta.join(' ・ ')}</span>`:'';
    const memoLine=st.memo?`<span class="smemo">${esc(st.memo)}</span>`:'';
    const rep=repLabel(st);const repLine=rep?`<span class="srep">↻ ${rep}</span>`:'';
    const hasKids=st.children&&st.children.length;
    const isCol=collapsedSteps[detailSid]&&collapsedSteps[detailSid][st.id];
    const children=hasKids?`<div class="schildren">${renderStepNodes(st.children,path.concat(i))}</div>`:'';
    const upDis=i===0?'disabled':'';
    const downDis=i===steps.length-1?'disabled':'';
    const moveBtn=`<button class="smini" data-movestep="${p}" title="移動">⇄</button>`;
    const toggleBtn=hasKids?`<button class="toggle-btn" data-togglestep="${st.id}">${isCol?'▶':'▼'}</button>`:'<span class="toggle-spacer" style="display:inline-block;width:16px;"></span>';
    const subCount=hasKids?`<span class="sub-count" style="font-size:10px;color:var(--ink-faint);margin-left:6px;">${countOpenSteps(st.children)}</span>`:'';
    return `<div class="snode${isCol?' collapsed':''}"><div class="srow"><button class="scheck" data-check="${p}"></button>${toggleBtn}<div class="stext" data-opentask="${p}">${esc(st.text)}${subCount}${metaLine}${memoLine}${repLine}</div><button class="smove" data-up="${p}" ${upDis}>↑</button><button class="smove" data-down="${p}" ${downDis}>↓</button>${moveBtn}<button class="smini" data-delstep="${p}">×</button></div>${children}</div>`;
  }).join('');
}
function encPath(path){return path.join('|');}
function decPath(str){return str.split('|').map(s=>/^-?\d+$/.test(s)?Number(s):s);}

function getRootStepsByPath(s,path){
  // pathが['g',groupId,...] で始まればカテゴリ内、それ以外は通常のsteps
  if(path[0]==='g'){
    const g=(s.groups||[]).find(x=>x.id===path[1]);
    return g?g.steps:null;
  }
  return s.steps;
}
function getNumericPath(path){
  // ['g',groupId,0,1] → [0,1], [0,1,2] → [0,1,2]
  return path[0]==='g'?path.slice(2):path;
}
function getStepByPath(s,path){
  const root=getRootStepsByPath(s,path);if(!root)return null;
  const np=getNumericPath(path);
  let arr=root;let node=null;
  for(const idx of np){node=arr[idx];if(!node)return null;arr=node.children||[];}
  return node;
}
function getParentArr(s,path){
  const root=getRootStepsByPath(s,path);if(!root)return null;
  const np=getNumericPath(path);
  let arr=root;
  for(let i=0;i<np.length-1;i++){arr=arr[np[i]].children;}
  return arr;
}

let trailExpanded={}; // 3→7

let trailMode='theme'; // 'theme' or 'date'
function renderTrail(){
  const fb=document.getElementById('trailFilter');if(fb)fb.innerHTML='';
  const b=document.getElementById('trailBody');
  if(trailFullStar){renderTrailFull(b);return;}
  trailFilterGroups=[];
  if(!diffs.length){b.innerHTML=`<div class="empty"><span class="em-glyph">✦</span><br></div>`;return;}
  if(trailMode==='date'){
    // 日付順：年→日付でまとめる
    const sorted=[...diffs].sort((a,b)=>b.ts-a.ts);
    const byYear={};
    sorted.forEach(d=>{
      const dt=new Date(d.ts);

      if(!byYear[y])byYear[y]=[];

    });
    let h='';
    Object.keys(byYear).sort((a,b)=>b-a).forEach(y=>{
      h+=`<div class="trail-year"><div class="trail-year-label">${y}年</div>`;
      // 同じ日付ごとにグループ化
      const byDate={};
      byYear[y].forEach(d=>{
        const dt=new Date(d.ts);
        const k=`${dt.getMonth()+1}/${dt.getDate()}`;
        if(!byDate[k])byDate[k]={items:[],dt};
        byDate[k].items.push(d);
      });
      Object.keys(byDate).forEach(k=>{
        const{items,dt}=byDate[k];
        const wd=['日','月','火','水','木','金','土'][dt.getDay()];
        h+=`<div class="trail-date-group"><div class="trail-date-label">${k} (${wd})</div>`;

          const memo=d.memo?`<div class="step-memo">${escLink(d.memo)}</div>`:'';
          return `<div class="step"><div class="what">${esc(d.text)}${tag}</div>${memo}</div>`;
        }).join('');
        h+=`</div>`;

    });

  }

  stars.forEach(s=>{const ds=diffs.filter(d=>d.starId===s.id).sort((a,b)=>b.ts-a.ts);if(ds.length)h+=trailBlock(s.id,'★ '+esc(s.dir),ds,single);});

}
function trailBlock(key,title,ds,showAll){

    more=`<button class="trail-more" data-expand="${key}">のこり ${Math.min(ds.length-3,4)} 件を見る ›</button>`;
  }else if(expanded&&ds.length>7){
    more=`<button class="trail-more" data-openfull="${key}">すべて見る (${ds.length}件) ›</button>`;

function renderTrailFull(b){
  const key=trailFullStar;

  let starObj=null;
  if(isLoose){title='— 未分類';ds=diffs.filter(d=>!d.starId||!stars.find(s=>s.id===d.starId));}

function metricChart(g){
  const kind=g.metric.kind;const unit=g.metric.unit||'';
  const pts=g.points;
  const W=300,H=100,pad=10;
  const minT=pts[0].ts, maxT=pts[pts.length-1].ts;
  let vals=pts.map(p=>p.val);
  let plotVals;
  if(kind==='sum'){let s=0;plotVals=vals.map(v=>{s+=v;return s;});}
  else plotVals=vals.slice();
  const vmin=Math.min(...plotVals),vmax=Math.max(...plotVals);
  const vrange=vmax-vmin||1;
  const trange=maxT-minT||1;
  const x=t=>pad+(W-pad*2)*((t-minT)/trange);
  const y=v=>H-pad-(H-pad*2)*((v-vmin)/vrange);
  const color=kind==='flat'?'#5a7a9c':'#c9a227';
  let segs='';
  for(let i=1;i<plotVals.length;i++){
    const dv=plotVals[i]-plotVals[i-1];
    let good=null;
    if(kind==='up')good=dv>=0;else if(kind==='down')good=dv<=0;else if(kind==='sum')good=true;
    const segColor=good===null?color:(good?'#c9a227':'#c7c2b3');
    segs+=`<line x1="${x(pts[i-1].ts).toFixed(1)}" y1="${y(plotVals[i-1]).toFixed(1)}" x2="${x(pts[i].ts).toFixed(1)}" y2="${y(plotVals[i]).toFixed(1)}" stroke="${segColor}" stroke-width="2" stroke-linecap="round"/>`;
  }
  const dots=pts.map((p,i)=>`<circle cx="${x(p.ts).toFixed(1)}" cy="${y(plotVals[i]).toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const latest=plotVals[plotVals.length-1];
  const kindLabel={up:'増やしたい',down:'減らしたい',sum:'積み上げる',flat:'記録'}[kind]||'';
  const fmtMd=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()}`;};
  return `<div class="mblock ${kind==='flat'?'flat':''}">

let calYear, calMonth, calMode='month', calAnchor=null; // calAnchor: 週/日表示の基準日(Date)
function gatherDated(){
  const out=[];
  const walk=(steps,star,path,groupId,groupName)=>{(steps||[]).forEach((st,i)=>{
    const p=path.concat(i);
    if(st.due)out.push({due:st.due,text:st.text,memo:st.memo,from:st.from,to:st.to,dur:st.dur,rep:st.rep,dir:star.dir,starId:star.id,stepId:st.id,path:p,groupId,groupName,kind:'step'});
    walk(st.children,star,p,groupId,groupName);
  });};
  stars.forEach(s=>{
    walk(s.steps,s,[],null,null);
    (s.groups||[]).forEach(g=>walk(g.steps,s,['g',g.id],g.id,g.name));
  });
  // 仮置きの中のタスクも、日付があればカレンダーに出す
  const inboxStar={id:'__inbox__',dir:'仮置き'};
  walk(inbox.steps,inboxStar,[],null,null);
  (inbox.groups||[]).forEach(g=>walk(g.steps,inboxStar,['g',g.id],g.id,g.name));
  return out;
}
// 予定を指定範囲に展開（繰り返しはオンザフライ展開）
function expandEvents(rangeStart,rangeEnd){
  const out=[];
  events.forEach(ev=>{
    const k=ev.kind==='task'?'task':'event';
    if(!ev.rep||ev.rep==='none'){
      const d=new Date(ev.due+'T00:00:00');
      if(d>=rangeStart&&d<=rangeEnd)out.push({...ev,due:ev.due,kind:k});
      return;
    }
    const start=new Date(ev.due+'T00:00:00');
    let cur=new Date(Math.max(start,rangeStart));
    cur.setHours(0,0,0,0);
    if(cur<start)cur=new Date(start);
    const limit=new Date(rangeEnd);limit.setHours(23,59,59,999);
    let safety=0;
    while(cur<=limit&&safety<400){
      safety++;
      let include=false;
      if(ev.rep==='daily')include=true;
      else if(ev.rep==='weekly'){
        if(ev.wd&&ev.wd.length)include=ev.wd.includes(cur.getDay());
        else include=cur.getDay()===start.getDay();
      }
      else if(ev.rep==='monthly'){
        if(ev.md&&ev.md.length)include=ev.md.includes(cur.getDate());
        else include=cur.getDate()===start.getDate();
      }
      if(include&&cur>=start)out.push({...ev,due:iso(cur),kind:k});
      cur.setDate(cur.getDate()+1);
    }
  });
  return out;
}

function startOfWeek(d){const x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x;}
function parseHM(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h+m/60;}
const HOUR_H=34, DAY_START=6, DAY_END=24; // 6時〜24時を表示
function eventTopHeight(it){
  let from=parseHM(it.from);
  let h;
  if(from==null)return null; // 時刻なし＝終日扱い
  if(it.to){h=Math.max(parseHM(it.to)-from,0.4);}
  else if(it.dur){h=Math.max(it.dur/60,0.4);}
  else h=0.8;
  const top=(from-DAY_START)*HOUR_H;
  return {top:Math.max(top,0),height:h*HOUR_H};
}
