/* バーチカルのタップ/ドラッグで予定追加 */
function attachVcalDrag(root){
  const cols=root.querySelectorAll('.vcol');
  cols.forEach(col=>{
    let dragging=false, startY=0, sel=null, startTop=0;
    const onDown=ev=>{
      ev.preventDefault();
      const rect=col.getBoundingClientRect();
      const py=(ev.touches?ev.touches[0].clientY:ev.clientY)-rect.top;
      startY=py;dragging=true;startTop=py;
      sel=document.createElement('div');sel.className='vcol-sel';
      sel.style.top=py+'px';sel.style.left='1px';sel.style.right='1px';sel.style.height='2px';
      col.appendChild(sel);
    };
    const onMove=ev=>{
      if(!dragging||!sel)return;
      const rect=col.getBoundingClientRect();
      const py=(ev.touches?ev.touches[0].clientY:ev.clientY)-rect.top;
      const top=Math.min(startY,py);const h=Math.abs(py-startY);
      sel.style.top=top+'px';sel.style.height=Math.max(h,2)+'px';
    };
    const onUp=ev=>{
      if(!dragging)return;dragging=false;
      const rect=col.getBoundingClientRect();
      const py=(ev.changedTouches?ev.changedTouches[0].clientY:ev.clientY)-rect.top;
      const top=Math.min(startY,py);const bottom=Math.max(startY,py);
      if(sel){sel.remove();sel=null;}
      // 時間に変換
      const fromHr=DAY_START+top/HOUR_H;
      const toHr=DAY_START+bottom/HOUR_H;
      const dur=Math.max(toHr-fromHr,0);
      const dueIso=col.dataset.coliso;
      // タップ（短い）→終日扱いではなく開始時刻のみ／ドラッグ→範囲
      let from=hmFromHr(fromHr), to=null;
      if(dur>=0.1)to=hmFromHr(toHr);
      openEventEditor(null,dueIso,{from,to});
    };
    col.addEventListener('mousedown',onDown);col.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
    col.addEventListener('touchstart',onDown,{passive:false});col.addEventListener('touchmove',onMove,{passive:false});col.addEventListener('touchend',onUp);
  });
}
function hmFromHr(hr){
  let h=Math.floor(hr);let m=Math.round((hr-h)*60/5)*5;
  if(m>=60){h++;m=0;}h=Math.max(0,Math.min(23,h));
  return `${h}:${String(m).padStart(2,'0')}`;
}
/* 横スワイプで前後送り */
function attachSwipe(root){
  let sx=0, sy=0, t=0, swiping=false;
  root.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;t=Date.now();swiping=true;},{passive:true});
  root.addEventListener('touchend',e=>{
    if(!swiping)return;swiping=false;
    const dx=e.changedTouches[0].clientX-sx;const dy=e.changedTouches[0].clientY-sy;const dt=Date.now()-t;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5&&dt<500){
      if(dx<0)calShift(1);else calShift(-1);
    }
  });
}

    diffsSnapshot.forEach(d=>{if(!existing.has(d.id))diffs.push(d);});
  }
  if(from==='arch')starsArch=starsArch.filter(x=>x.id!==s.id);
  else starsHold=starsHold.filter(x=>x.id!==s.id);
  await ss();await sd();await ssa();await ssh();renderAll();
  toast('現役に戻しました <span class="ts">★</span>');
}

function renderInboxTree(){
  const tree=document.getElementById('ibStepsTree');
  if(!inbox.groups)inbox.groups=[];
  const hasGroups=inbox.groups.length>0;
  const hasRootSteps=inbox.steps&&inbox.steps.length>0;
  if(!hasGroups&&!hasRootSteps){tree.innerHTML=`<div style="font-size:12.5px;color:var(--ink-faint);text-align:center;padding:14px 0;line-height:1.7;">仮<br></div>`;return;}
  let html='';
  if(hasRootSteps)html+=renderStepNodes(inbox.steps,[]);
  inbox.groups.forEach(g=>{
    const n=countOpenSteps(g.steps||[]);
    const isCol=collapsedGroups['__inbox__']&&collapsedGroups['__inbox__'][g.id];
    const tri=isCol?'▶':'▼';
    html+=`<div class="step-group${isCol?' collapsed':''}"><div class="step-group-head"><div class="step-group-name"><button class="toggle-btn" data-togglegroup="${g.id}">${tri}</button>${esc(g.name)}${n?`　<span style="color:var(--ink-faint);font-weight:400;font-size:11px;letter-spacing:0;">${n}</span>`:''}</div><button class="step-group-edit" data-editgroup="${g.id}">編集</button></div>`;
    if(g.steps&&g.steps.length)html+=renderStepNodes(g.steps,['g',g.id]);
    html+=`<button class="sadd-sub-in-group" data-addingroup="${g.id}"><span style="color:var(--star);font-weight:700;">+</span> このカテゴリにタスクを追加</button></div>`;
  });
  tree.innerHTML=html;
}

    collapsedStarCards[sid]=!collapsedStarCards[sid];

    const[sid,pathStr]=cb.dataset.sccheck.split('::');

async function moveStep(path,dir){
  const s=getContainer(detailSid);if(!s)return;
  const arr=getParentArr(s,path);if(!arr)return;
  const np=getNumericPath(path);const i=np[np.length-1];const j=i+dir;

}

let taskDetailPath=null;
function openTaskDetail(path){
  const s=getContainer(detailSid);if(!s)return;
  const node=getStepByPath(s,path);if(!node)return;
  taskDetailPath=path;
  document.getElementById('tdTitle').textContent=node.text;
  // meta
  let metaParts=[];
  if(node.due){const past=isPast(node.due);metaParts.push(`${fmtDue(node.due)}${past?'（過ぎました）':''}`);}
  const tm=fmtTime(node);if(tm)metaParts.push(tm);
  const rep=repLabel(node);if(rep)metaParts.push('↻ '+rep);
  document.getElementById('tdMeta').textContent=metaParts.join(' ・ ');
  // memo
  const memoEl=document.getElementById('tdMemo');
  if(node.memo){memoEl.textContent=node.memo;memoEl.style.display='block';}
  else{memoEl.style.display='none';}
  // children
  renderTaskChildren();
  openSheet('tdbg','tdsheet');
}
function renderTaskChildren(){
  const s=getContainer(detailSid);if(!s||!taskDetailPath)return;
  const node=getStepByPath(s,taskDetailPath);if(!node)return;
  const box=document.getElementById('tdChildren');
  if(!node.children||!node.children.length){
    box.innerHTML=`<div style="font-size:12.5px;color:var(--ink-faint);padding:10px 0;line-height:1.7;">まだサブタスクはありません。<br>必要なときだけ、ぶら下げればいい。</div>`;
    return;
  }
  // renderStepNodesは detailSid/collapsed状態をベースに描く。pathを継いで描画
  box.innerHTML=renderStepNodes(node.children,taskDetailPath);
}

function renderMvStep3(){
  // ステップ3：親タスクを選ぶ
  const target=document.getElementById('mvTargets');
  const destSid=moveCtx.destSid;
  const dest=getContainer(destSid);
  document.querySelector('#mvsheet h2') && (document.querySelector('#mvsheet h2').textContent='タスク選択');
  const note3=document.querySelector('#mvsheet .due-note');if(note3)note3.textContent='';
  let html=`<button class="mv-back" data-mvback2>‹ 戻る</button>`;
  // 全タスクをフラット化（自分自身と、自分の子孫は除外）
  const movingPath=moveCtx.path;
  const fromContainer=getContainer(moveCtx.fromSid);
  const movingNode=getStepByPath(fromContainer,movingPath);
  const movingId=movingNode?movingNode.id:null;
  const candidates=[];
  function walk(steps,prefix){
    (steps||[]).forEach((st,i)=>{
      // 自分自身、または自分の子孫は除外（同じテーマ内のみ）
      if(st.id===movingId)return;
      const newPath=prefix.concat(i);
      candidates.push({node:st,path:newPath,depth:prefix.length});
      walk(st.children,newPath);
    });
  }
  walk(dest.steps||[],[]);
  (dest.groups||[]).forEach(g=>walk(g.steps||[],['g',g.id]));
  if(!candidates.length){
    html+=`<p style="color:var(--ink-faint);font-size:12px;padding:14px 4px;">親にできるタスクがありません。</p>`;
  }else{
    candidates.forEach(c=>{
      const indent=c.depth*14;
      html+=`<button class="mv-opt" data-mvparent="${encPath(c.path)}" style="padding-left:${16+indent}px;">└ ${esc(c.node.text)}</button>`;
    });
  }
  target.innerHTML=html;
}

document.getElementById('mvTargets').addEventListener('click',async e=>{
  // 戻るボタン（step1へ）
  if(e.target.closest('[data-mvback]')){moveCtx.step=1;moveCtx.destSid=null;renderMvStep1();return;}
  // 戻るボタン（step2へ）
  if(e.target.closest('[data-mvback2]')){moveCtx.step=2;renderMvStep2();return;}
  // 「タスク選択」ボタン → step3へ
  if(e.target.closest('[data-mvinside]')){moveCtx.step=3;renderMvStep3();return;}
  // テーマ or 仮置き選択（step1→step2）
  const sb=e.target.closest('[data-mvstar]');
  if(sb){moveCtx.destSid=sb.dataset.mvstar;moveCtx.step=2;renderMvStep2();return;}
  // 親タスクを選んだ：子として入れる
  const pp=e.target.closest('[data-mvparent]');
  if(pp){
    const parentPath=decPath(pp.dataset.mvparent);
    const fromContainer=getContainer(moveCtx.fromSid);
    const destContainer=getContainer(moveCtx.destSid);
    if(!fromContainer||!destContainer)return;
    const path=moveCtx.path;
    const arr=getParentArr(fromContainer,path);
    const np=getNumericPath(path);
    const idx=np[np.length-1];
    const node=arr.splice(idx,1)[0];
    // 親ノードの children に入れる
    const parentNode=getStepByPath(destContainer,parentPath);
    if(!parentNode){toast('親タスクが見つかりません');return;}
    if(!parentNode.children)parentNode.children=[];
    parentNode.children.push(node);
    await ss();await sib();
    if(moveCtx.fromSid==='__inbox__'||moveCtx.destSid==='__inbox__')renderInboxTree();
    renderStepsTree();renderStars();renderCal();closeSheet('mvbg','mvsheet');toast('タスクの中に入れました');
    moveCtx=null;return;
  }
  // 通常の移動先選択（root or カテゴリID）
  const b=e.target.closest('[data-mv]');
  if(!b)return;
  if(b.classList.contains('current'))return;
  const dest=b.dataset.mv;
  const fromContainer=getContainer(moveCtx.fromSid);
  const destContainer=getContainer(moveCtx.destSid);
  if(!fromContainer||!destContainer||!moveCtx)return;
  // 移動元から抜く
  const path=moveCtx.path;
  const arr=getParentArr(fromContainer,path);
  const np=getNumericPath(path);
  const idx=np[np.length-1];
  const node=arr.splice(idx,1)[0];
  // 移動先に追加
  if(dest==='root'){
    if(!destContainer.steps)destContainer.steps=[];destContainer.steps.push(node);
  }else{
    if(!destContainer.groups)destContainer.groups=[];
    const g=destContainer.groups.find(x=>x.id===dest);
    if(g){if(!g.steps)g.steps=[];g.steps.push(node);}
    else{if(!destContainer.steps)destContainer.steps=[];destContainer.steps.push(node);}
  }
  // 保存（両方変わる可能性）
  await ss();await sib();
  // 再描画：開いてるシートに応じて
  if(moveCtx.fromSid==='__inbox__'||moveCtx.destSid==='__inbox__')renderInboxTree();
  renderStepsTree();renderStars();renderCal();closeSheet('mvbg','mvsheet');toast('移動しました');
  moveCtx=null;
});
/* sort by due: 期日ありを先頭(昇順)、期日なしは後ろ。同階層すべてに再帰適用 */
document.getElementById('sortByDue').addEventListener('click',async()=>{
  const s=getContainer(detailSid);if(!s)return;
  const has=(s.steps&&s.steps.length)||(s.groups||[]).some(g=>g.steps&&g.steps.length);
  if(!has){toast('並べ替えるタスクがありません');return;}
  const sortArr=arr=>{
    arr.sort((a,b)=>{
      if(a.due&&b.due)return a.due<b.due?-1:a.due>b.due?1:0;
      if(a.due)return -1;if(b.due)return 1;return 0;
    });
    arr.forEach(st=>{if(st.children&&st.children.length)sortArr(st.children);});
  };
  if(s.steps)sortArr(s.steps);
  (s.groups||[]).forEach(g=>{if(g.steps)sortArr(g.steps);});
  await ss();renderStepsTree();renderStars();toast('期日順に整えました');
});

async function finalizeComplete(withNote){
  if(!completeCtx)return;

  closeSheet('cbg','csheet');

  const isRep=node.rep&&node.rep!=='none';
  await new Promise(r=>setTimeout(r,150));
  // ジャーナルへ（メモ込み、繰り返しフラグ込み）
  // テーマの指標に対する数値入力を拾ってmetricLogsに保存
  const s2=getContainer(detailSid);

      metricLogs.push({id:uid(),starId:detailSid,metricId:inp.dataset.mid,val:v,ts:Date.now()});
    });
  }
  // カテゴリIDを判定（pathが['g',groupId,...]形式なら）
  const groupId=path[0]==='g'?path[1]:null;
  diffs.push({id:uid(),text:node.text,memo:note||null,starId:detailSid==='__inbox__'?null:detailSid,groupId:detailSid==='__inbox__'?null:groupId,ts:Date.now(),fromTask:true,repeat:isRep});
  if(isRep){
    // 繰り返し：消さず done を立てずに「次の期日」へ更新して残す
    node.due=nextDue(node);
  }else{
    const np=getNumericPath(path);
    getParentArr(s,path).splice(np[np.length-1],1);
  }
  await ss();await sd();await sml();renderStepsTree();renderStars();renderTrail();renderWeek();renderCal();renderMetricsOnStar();
  toast(isRep?'記録しました':'完了');
  completeCtx=null;
}
function nextDue(node){
  const base=node.due?new Date(node.due+'T00:00:00'):new Date();
  const d=new Date(base);
  if(node.rep==='daily'){d.setDate(d.getDate()+1);}
  else if(node.rep==='monthly'){
    if(node.md&&node.md.length){
      // 次に来る選択日（最大2か月先まで探索）
      for(let add=1;add<=62;add++){const cand=new Date(base);cand.setDate(cand.getDate()+add);if(node.md.includes(cand.getDate())){return iso(cand);}}
    }
    d.setMonth(d.getMonth()+1);
  }
  else if(node.rep==='weekly'){
    if(node.wd&&node.wd.length){
      for(let add=1;add<=7;add++){const cand=new Date(base);cand.setDate(cand.getDate()+add);if(node.wd.includes(cand.getDay())){return iso(cand);}}
    }
    d.setDate(d.getDate()+7);
  }
  return iso(d);
}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function hrFromHm(s){const n=normalizeTime(s);if(!n)return null;const[h,m]=n.split(':').map(Number);return h+m/60;}
function updateEDur(){
  const fH=hrFromHm(document.getElementById('eFrom').value);
  const tH=hrFromHm(document.getElementById('eTo').value);
  const el=document.getElementById('eDurCalc');
  if(fH==null||tH==null||tH<=fH){el.textContent='—';return;}
  const mins=Math.round((tH-fH)*60);
  el.textContent=mins>=60?`${Math.floor(mins/60)}時間${mins%60?(mins%60)+'分':''}`:`${mins}分`;
}

function attachTimeAutoFormat(el){
  el.addEventListener('blur',()=>{
    const n=normalizeTime(el.value);
    if(n)el.value=n;
  });
  el.addEventListener('input',e=>{
    const v=el.value.replace(/[^\d:：．]/g,'');
    // 数字4桁になった瞬間に「hh:mm」化（3桁での先走り変換はしない）
    if(/^\d{4}$/.test(v)){
      const h=+v.slice(0,2),m=+v.slice(2);
      if(h<24&&m<60){el.value=`${h}:${String(m).padStart(2,'0')}`;updateEDur();}
    }
  });
}

function updateStepDur(){
  const fH=hrFromHm(document.getElementById('stepFrom').value);
  const tH=hrFromHm(document.getElementById('stepTo').value);
  const el=document.getElementById('stepDurCalc');
  const hidden=document.getElementById('stepDur');
  if(fH==null||tH==null||tH<=fH){el.textContent='—';hidden.value='';return;}
  const mins=Math.round((tH-fH)*60);
  el.textContent=mins>=60?`${Math.floor(mins/60)}時間${mins%60?(mins%60)+'分':''}`:`${mins}分`;
  hidden.value=mins;
}

document.querySelectorAll('#ssheet .dur-p').forEach(b=>{

    const fH=hrFromHm(document.getElementById('stepFrom').value);
    if(fH==null){toast('まず開始時刻を入れてください');return;}
    const m=+b.dataset.stepdur;
    const totalMin=Math.round(fH*60)+m;
    const h=Math.floor(totalMin/60)%24;const mm=totalMin%60;
    document.getElementById('stepTo').value=`${h}:${String(mm).padStart(2,'0')}`;
    updateStepDur();
  });
});
function normalizeTime(v){
  if(!v)return null;v=v.trim();
  // "9", "9:00", "0900", "09:00" などを許容
  v=v.replace(/[：．]/g,':');
  if(/^\d{1,2}$/.test(v))return `${+v}:00`;
  if(/^\d{3,4}$/.test(v)){const h=+v.slice(0,v.length-2);const m=+v.slice(-2);return `${h}:${String(m).padStart(2,'0')}`;}
  const m=v.match(/^(\d{1,2}):(\d{1,2})$/);if(m)return `${+m[1]}:${String(+m[2]).padStart(2,'0')}`;
  return null;
}

function collectStepInput(){
  const txt=document.getElementById('stepText').value.trim();if(!txt)return null;
  const memo=document.getElementById('stepMemo').value.trim()||null;
  const due=document.getElementById('stepDue').value||null;
  const from=normalizeTime(document.getElementById('stepFrom').value);
  const to=normalizeTime(document.getElementById('stepTo').value);
  const dur=document.getElementById('stepDur').value?+document.getElementById('stepDur').value:null;
  const rep=repState;const wd=(rep==='weekly')?wdState.slice():[];const md=(rep==='monthly')?mdState.slice():[];
  return {text:txt,memo,due,from,to,dur,rep,wd,md};
}

});

function refreshDiffMetrics(){
  const starId=document.getElementById('diffStar').value;
  const box=document.getElementById('diffMetrics');
  if(!starId){box.innerHTML='';return;}
  const s=stars.find(x=>x.id===starId);if(!s||!s.metrics||!s.metrics.length){box.innerHTML='';return;}
  let h=`<div style="font-size:11px;color:var(--ink-faint);letter-spacing:0.06em;margin:8px 0 4px;"></div>`;
  s.metrics.forEach(m=>{
    h+=`<div class="metric-input-row" style="margin-top:6px;"><span style="font-size:12px;color:var(--ink-soft);min-width:78px;">${esc(m.name)}</span><input type="text" inputmode="decimal" data-mid="${m.id}" placeholder="数字" style="font-size:14px;padding:10px 12px;"><span class="metric-unit-label">${esc(m.unit||'')}</span></div>`;
  });
  box.innerHTML=h;
}
function refreshDiffGroup(){
  const starId=document.getElementById('diffStar').value;
  const zone=document.getElementById('diffGroupZone');
  const sel=document.getElementById('diffGroup');
  if(!starId){zone.style.display='none';sel.innerHTML='<option value="">— 未分類</option>';return;}
  const s=stars.find(x=>x.id===starId);
  const groups=s&&s.groups?s.groups:[];
  if(!groups.length){zone.style.display='none';sel.innerHTML='<option value="">— 未分類</option>';return;}
  zone.style.display='block';
  sel.innerHTML=`<option value="">— 未分類</option>`+groups.map(g=>`<option value="${g.id}">▸ ${esc(g.name)}</option>`).join('');
}

document.getElementById('calSeg').addEventListener('click',e=>{
  const b=e.target.closest('[data-mode]');if(!b)return;
  calMode=b.dataset.mode;
  // 週/日に切り替えたら、月表示の基準月の1日あたりを基準にしておく
  if((calMode==='week'||calMode==='day')&&!calAnchor)calAnchor=new Date();
  renderCal();
});
function calShift(dir){
  if(calMode==='month'){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}}
  else if(calMode==='week'){calAnchor=new Date(calAnchor);calAnchor.setDate(calAnchor.getDate()+3*dir);}
  else{calAnchor=new Date(calAnchor);calAnchor.setDate(calAnchor.getDate()+dir);}
  renderCal();
}
document.getElementById('calPrev').addEventListener('click',()=>calShift(-1));
document.getElementById('calNext').addEventListener('click',()=>calShift(1));
document.getElementById('v-cal').addEventListener('click',async e=>{
  if(e.target.closest('a.ulink'))return; // リンクは普通に開く
  // テーマのタスクのチェックボックス
  const sck=e.target.closest('[data-stepdone]');
  if(sck){
    e.stopPropagation();
    const[sid,pathStr]=sck.dataset.stepdone.split('::');
    const path=decPath(pathStr);
    detailSid=sid; // completeStepはdetailSidに依存
    completeStep(sck,path);
    return;
  }
  const cb=e.target.closest('[data-taskdone]');
  if(cb){
    e.stopPropagation();
    const id=cb.dataset.taskdone;
    const ev=events.find(x=>x.id===id);if(!ev)return;
    ev.done=!ev.done;
    if(ev.done){
      diffs.unshift({id:uid(),ts:Date.now(),text:ev.text,starId:null,fromTask:true,memo:null});
      await sd();
      toast('完了');
    }
    await sev();renderCal();renderTrail();renderWeek();
    return;
  }
  const t=e.target.closest('[data-editev]');
  if(t){const ev=events.find(x=>x.id===t.dataset.editev);if(ev)openEventEditor(ev);return;}
  const tt=e.target.closest('[data-edittask]');
  if(tt){
    const[sid,pathStr]=tt.dataset.edittask.split('::');
    const path=decPath(pathStr);
    detailSid=sid;
    openStepEditor(sid,null,path);
    return;
  }
  const c=e.target.closest('[data-cellday]');
  if(c){
    // その日の日表示に移動
    calAnchor=new Date(c.dataset.cellday+'T00:00:00');
    calMode='day';
    document.querySelectorAll('#calSeg .seg').forEach(b=>b.classList.toggle('active',b.dataset.mode==='day'));
    renderCal();
    return;
  }
  const ed=e.target.closest('[data-emptyday]');
  if(ed&&!e.target.closest('[data-editev]')&&!e.target.closest('[data-edittask]')){openEventEditor(null,ed.dataset.emptyday);return;}
});

tick();setInterval(tick,10000);
load();
